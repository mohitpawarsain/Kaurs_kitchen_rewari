<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal — Kaur's Kitchen (Rewari)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --cream:        #FBF3E6;
  --cream-deep:   #F3E5CE;
  --paper:        #FFFDF9;
  --ink:          #2A2016;
  --ink-soft:     #6E5F4E;
  --ink-faint:    #9C8D7A;
  --marigold:     #E2900C;
  --marigold-deep:#B96F00;
  --marigold-tint:#FDF0D9;
  --maroon:       #9A3324;
  --maroon-deep:  #7A2519;
  --maroon-tint:  #FBE7E2;
  --sage:         #4B7A52;
  --sage-tint:    #E7F1E5;
  --white:        #FFFFFF;
  --line:         rgba(42,32,22,0.10);
  --line-strong:  rgba(42,32,22,0.18);
  --shadow-sm:    0 2px 10px rgba(42,32,22,0.06);
  --shadow-md:    0 10px 28px rgba(42,32,22,0.10);
  --shadow-lg:    0 24px 60px rgba(42,32,22,0.18);
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-pill: 999px;
  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', sans-serif;
  --sidebar-w: 240px;
  --topbar-h: 64px;
  --ease: cubic-bezier(.22,.68,0,1);
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; font-family:var(--font-body); background:var(--cream); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ font-family:var(--font-display); margin:0; font-weight:600; color:var(--ink); }
p{ margin:0; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
input,select,textarea{ font-family:inherit; }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:6px; }

/* ============ LOGIN GATE ============ */
.login-gate{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background: radial-gradient(circle at 20% 20%, rgba(226,144,12,.10), transparent 55%), radial-gradient(circle at 85% 80%, rgba(154,51,36,.10), transparent 55%), var(--cream);
}
.login-card{
  width:100%; max-width:380px; background:var(--white); border-radius:var(--r-lg); box-shadow:var(--shadow-lg); padding:34px 30px;
}
.login-brand{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
.login-brand .mark{ width:42px; height:42px; border-radius:50%; background:conic-gradient(from 200deg, var(--marigold), var(--maroon), var(--marigold)); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-weight:700; }
.login-brand b{ font-family:var(--font-display); font-size:18px; color:var(--maroon-deep); display:block; }
.login-brand span{ font-size:11px; color:var(--ink-soft); letter-spacing:.05em; }
.login-note{ font-size:12px; color:var(--ink-faint); margin-top:16px; line-height:1.6; background:var(--cream-deep); padding:12px 14px; border-radius:var(--r-md); }

/* ============ SHELL LAYOUT ============ */
.admin-shell{ display:flex; min-height:100vh; }
.sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--ink); color:var(--cream); display:flex; flex-direction:column;
  position:fixed; top:0; bottom:0; left:0; z-index:50; transition:transform .28s var(--ease);
}
.sidebar-brand{ display:flex; align-items:center; gap:10px; padding:20px 18px; border-bottom:1px solid rgba(251,243,230,.1); }
.sidebar-brand .mark{ width:36px; height:36px; border-radius:50%; background:conic-gradient(from 200deg, var(--marigold), var(--maroon), var(--marigold)); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-weight:700; font-size:14px; flex-shrink:0; }
.sidebar-brand b{ font-family:var(--font-display); font-size:15px; display:block; color:#fff; }
.sidebar-brand span{ font-size:10px; color:rgba(251,243,230,.6); letter-spacing:.05em; }
.sidebar-nav{ flex:1; padding:14px 10px; overflow-y:auto; }
.sidebar-nav a{
  display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:var(--r-md); font-weight:600; font-size:13.5px;
  color:rgba(251,243,230,.68); margin-bottom:3px; transition:background .15s, color .15s;
}
.sidebar-nav a svg{ flex-shrink:0; opacity:.85; }
.sidebar-nav a:hover{ background:rgba(251,243,230,.06); color:#fff; }
.sidebar-nav a.active{ background:var(--marigold); color:#fff; }
.sidebar-nav a.active svg{ opacity:1; }
.sidebar-foot{ padding:14px; border-top:1px solid rgba(251,243,230,.1); }
.sidebar-foot a{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:rgba(251,243,230,.7); padding:9px 10px; border-radius:var(--r-md); }
.sidebar-foot a:hover{ background:rgba(251,243,230,.08); color:#fff; }

.main-area{ flex:1; margin-left:var(--sidebar-w); display:flex; flex-direction:column; min-width:0; }
.topbar{
  height:var(--topbar-h); background:var(--paper); border-bottom:1px solid var(--line); display:flex; align-items:center;
  justify-content:space-between; padding:0 24px; position:sticky; top:0; z-index:40;
}
.topbar h1{ font-size:19px; }
.topbar-actions{ display:flex; align-items:center; gap:10px; }
.hamburger{ display:none; background:none; border:none; padding:8px; }
.content{ padding:26px; flex:1; }

@media (max-width: 900px){
  .sidebar{ transform:translateX(-100%); box-shadow:var(--shadow-lg); }
  .sidebar.open{ transform:translateX(0); }
  .main-area{ margin-left:0; }
  .hamburger{ display:flex; }
  .sidebar-overlay{ position:fixed; inset:0; background:rgba(20,14,8,.4); z-index:45; opacity:0; pointer-events:none; transition:opacity .2s; }
  .sidebar-overlay.open{ opacity:1; pointer-events:auto; }
}

/* ============ BUTTONS ============ */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:700; font-size:13.5px; border:none; border-radius:var(--r-pill); padding:10px 18px; transition:transform .12s var(--ease), box-shadow .12s, background .12s; white-space:nowrap; }
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--marigold); color:#fff; box-shadow:0 6px 16px rgba(226,144,12,.3); }
.btn-primary:hover{ background:var(--marigold-deep); }
.btn-outline{ background:transparent; color:var(--ink); border:1.5px solid var(--line-strong); }
.btn-outline:hover{ border-color:var(--ink); background:var(--white); }
.btn-danger{ background:var(--maroon-tint); color:var(--maroon-deep); }
.btn-danger:hover{ background:var(--maroon); color:#fff; }
.btn-ghost{ background:var(--white); color:var(--ink); box-shadow:var(--shadow-sm); }
.btn-sm{ padding:7px 13px; font-size:12.5px; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.icon-btn{ width:36px; height:36px; border-radius:50%; background:var(--white); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
.icon-btn:hover{ border-color:var(--marigold); color:var(--marigold-deep); }

/* ============ CARDS / STATS ============ */
.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:26px; }
@media (max-width:900px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }
.stat-card{ background:var(--white); border-radius:var(--r-lg); padding:20px; box-shadow:var(--shadow-sm); }
.stat-card .icn{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:12px; }
.stat-card b{ font-family:var(--font-display); font-size:26px; display:block; }
.stat-card span{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
.card{ background:var(--white); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); padding:22px; }
.section-title{ font-size:17px; margin-bottom:16px; }

/* ============ TOOLBAR / FILTERS ============ */
.toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
.toolbar-left{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; flex:1; }
.search-box{ display:flex; align-items:center; gap:8px; background:var(--white); border:1.5px solid var(--line-strong); border-radius:var(--r-pill); padding:8px 14px; min-width:220px; }
.search-box input{ border:none; outline:none; background:transparent; font-size:13.5px; width:100%; }
.select-mini{ padding:8px 13px; border-radius:var(--r-pill); border:1.5px solid var(--line-strong); background:var(--white); font-size:13px; font-weight:600; }

/* ============ TABLE ============ */
.table-wrap{ background:var(--white); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); overflow:hidden; }
table{ width:100%; border-collapse:collapse; }
th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700; padding:13px 16px; border-bottom:1.5px solid var(--line); white-space:nowrap; }
td{ padding:12px 16px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
tr:last-child td{ border-bottom:none; }
tr:hover td{ background:var(--cream-deep); }
.row-thumb{ width:42px; height:42px; border-radius:10px; object-fit:cover; background:var(--cream-deep); }
.cell-name{ font-weight:700; }
.cell-sub{ font-size:11.5px; color:var(--ink-faint); }
.table-actions{ display:flex; gap:6px; justify-content:flex-end; }
.empty-row td{ text-align:center; padding:50px 20px; color:var(--ink-faint); }

/* ============ BADGES / TOGGLES ============ */
.badge{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:var(--r-pill); }
.badge-marigold{ background:var(--marigold-tint); color:var(--marigold-deep); }
.badge-sage{ background:var(--sage-tint); color:#2F5D34; }
.badge-maroon{ background:var(--maroon-tint); color:var(--maroon-deep); }
.badge-gray{ background:var(--cream-deep); color:var(--ink-soft); }
.switch{ position:relative; display:inline-block; width:38px; height:22px; flex-shrink:0; }
.switch input{ opacity:0; width:0; height:0; }
.switch .track{ position:absolute; inset:0; background:var(--line-strong); border-radius:var(--r-pill); transition:background .15s; cursor:pointer; }
.switch .track::before{ content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .15s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
.switch input:checked + .track{ background:var(--marigold); }
.switch input:checked + .track::before{ transform:translateX(16px); }
.color-swatch{ width:26px; height:26px; border-radius:8px; border:2px solid var(--white); box-shadow:0 0 0 1.5px var(--line-strong); display:inline-block; }

/* ============ DRAWER / MODAL FORM ============ */
.drawer-overlay{ position:fixed; inset:0; background:rgba(20,14,8,.4); z-index:80; opacity:0; pointer-events:none; transition:opacity .22s var(--ease); }
.drawer-overlay.open{ opacity:1; pointer-events:auto; }
.form-drawer{
  position:fixed; top:0; right:0; height:100%; width:min(520px,94vw); background:var(--paper); z-index:81; box-shadow:-16px 0 50px rgba(0,0,0,.18);
  transform:translateX(105%); transition:transform .28s var(--ease); display:flex; flex-direction:column;
}
.form-drawer.open{ transform:translateX(0); }
.form-drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line); }
.form-drawer-body{ padding:20px 22px; overflow-y:auto; flex:1; }
.form-drawer-foot{ padding:16px 22px; border-top:1px solid var(--line); display:flex; gap:10px; }
.form-drawer-foot .btn{ flex:1; }

.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:700; margin-bottom:6px; color:var(--ink-soft); }
.field input, .field select, .field textarea{
  width:100%; padding:11px 13px; border-radius:var(--r-md); border:1.5px solid var(--line-strong); background:var(--white);
  font-size:13.5px; color:var(--ink); outline:none; transition:border-color .12s;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--marigold); }
.field-hint{ font-size:11px; color:var(--ink-faint); margin-top:5px; }
.field-row{ display:flex; gap:12px; }
.field-row .field{ flex:1; }
.checkbox-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.checkbox-row{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; background:var(--white); padding:10px 12px; border-radius:var(--r-md); border:1.5px solid var(--line); }
.repeat-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.repeat-row input{ flex:1; }
.repeat-row button{ flex-shrink:0; }
.form-section-label{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin:22px 0 10px; padding-top:16px; border-top:1px solid var(--line); }
.form-section-label:first-child{ margin-top:0; padding-top:0; border-top:none; }
.placeholder-gen{ display:flex; gap:8px; align-items:flex-end; background:var(--cream-deep); padding:12px; border-radius:var(--r-md); margin-bottom:10px; }
.placeholder-gen .field{ margin-bottom:0; flex:1; }
.img-preview-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.img-preview-row img{ width:52px; height:52px; border-radius:8px; object-fit:cover; box-shadow:var(--shadow-sm); }

/* ============ ORDER DETAIL EXPAND ============ */
.order-detail{ background:var(--cream-deep); padding:16px; }
.order-detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; font-size:13px; }
@media (max-width:700px){ .order-detail-grid{ grid-template-columns:1fr; } }
.order-detail h5{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:8px; }
.order-item-line{ display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
.status-select{ padding:6px 10px; border-radius:var(--r-pill); border:1.5px solid var(--line-strong); font-size:12px; font-weight:700; background:var(--white); }

/* ============ EMPTY STATE ============ */
.empty-block{ text-align:center; padding:60px 20px; color:var(--ink-faint); }
.empty-block .icn{ font-size:40px; margin-bottom:12px; }

/* ============ TOAST ============ */
.toast-stack{ position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:10px; }
.toast{ background:var(--ink); color:var(--cream); padding:12px 18px; border-radius:var(--r-md); box-shadow:var(--shadow-lg); font-size:13px; font-weight:600; animation:toastIn .25s var(--ease); }
.toast.success{ background:#2F5D34; }
.toast.error{ background:var(--maroon-deep); }
@keyframes toastIn{ from{ opacity:0; transform:translateY(-12px);} to{ opacity:1; transform:translateY(0);} }

/* ============ DATA / SETTINGS PAGE ============ */
.data-actions{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:800px){ .data-actions{ grid-template-columns:1fr; } }
.data-action-card{ background:var(--white); border-radius:var(--r-lg); padding:20px; box-shadow:var(--shadow-sm); }
.data-action-card h4{ font-size:14.5px; margin-bottom:6px; }
.data-action-card p{ font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; line-height:1.55; }
.danger-zone{ border:1.5px dashed var(--maroon); background:var(--maroon-tint); }
.form-grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:700px){ .form-grid-2{ grid-template-columns:1fr; } }

.divider{ height:1px; background:var(--line); border:none; margin:18px 0; }
.text-muted{ color:var(--ink-soft); }
.text-faint{ color:var(--ink-faint); }
.flex{ display:flex; } .items-center{ align-items:center; } .justify-between{ justify-content:space-between; }
.gap-8{ gap:8px; } .gap-12{ gap:12px; }
.mt-8{ margin-top:8px; } .mt-16{ margin-top:16px; } .mb-16{ margin-bottom:16px; }

</style>
</head>

<script>
/* ============================================================
   KAUR'S KITCHEN — DATA LAYER
   All product/category/offer/review data lives here, decoupled
   from the UI. Swap `image` fields for real photo paths later,
   e.g. "/images/products/chicken-bhuna-masala.webp", with zero
   changes needed elsewhere.
   ============================================================ */

/* ---- Placeholder image generator -------------------------------------
   Produces a branded, plate-style SVG illustration (gradient backdrop +
   ceramic plate + soft steam wisps + dish emoji) per product so the site
   never shows a broken image before real photography is uploaded.
   Replace KK.products[i].images[n] with a real file path when ready,
   e.g. "/images/products/chicken-bhuna-masala.webp" — nothing else
   in the UI needs to change. */
function kkPlaceholder(emoji, from, to){
  const uid = Math.random().toString(36).slice(2,8);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
    <defs>
      <linearGradient id="bg${uid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${from}"/><stop offset="1" stop-color="${to}"/>
      </linearGradient>
      <radialGradient id="plate${uid}" cx="0.4" cy="0.35" r="0.75">
        <stop offset="0" stop-color="#FFFDF9"/><stop offset="1" stop-color="#F1E7D6"/>
      </radialGradient>
      <filter id="soft${uid}" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="14"/>
      </filter>
    </defs>
    <rect width="640" height="480" fill="url(#bg${uid})"/>
    <circle cx="560" cy="40" r="130" fill="rgba(255,255,255,0.08)"/>
    <circle cx="40" cy="450" r="110" fill="rgba(255,255,255,0.07)"/>
    <g opacity="0.5">
      <circle cx="90" cy="70" r="3" fill="#fff"/><circle cx="120" cy="55" r="2" fill="#fff"/>
      <circle cx="550" cy="410" r="3" fill="#fff"/><circle cx="580" cy="430" r="2" fill="#fff"/>
    </g>
    <ellipse cx="320" cy="410" rx="150" ry="22" fill="rgba(20,14,8,0.16)" filter="url(#soft${uid})"/>
    <circle cx="320" cy="248" r="168" fill="url(#plate${uid})" stroke="rgba(255,255,255,0.9)" stroke-width="10"/>
    <circle cx="320" cy="248" r="140" fill="none" stroke="rgba(42,32,22,0.06)" stroke-width="2"/>
    <g stroke="rgba(255,255,255,0.85)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M262 130 C250 100 268 78 258 52"/>
      <path d="M300 122 C288 92 306 70 296 44"/>
      <path d="M340 122 C352 92 334 70 344 44"/>
    </g>
    <text x="320" y="270" font-size="140" text-anchor="middle" dominant-baseline="middle">${emoji}</text>
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

const KK = {};

KK.categories = [
  { id:"veg-main",   name:"Veg Mains",   icon:"🥘", color:["#8FBF6F","#4B7A52"] },
  { id:"chicken",    name:"Chicken",     icon:"🍗", color:["#E2900C","#B96F00"] },
  { id:"mutton",     name:"Mutton",      icon:"🍖", color:["#9A3324","#6E241A"] },
  { id:"fish",       name:"Fish",        icon:"🐟", color:["#3C7DA6","#265675"] },
  { id:"egg",        name:"Egg",         icon:"🥚", color:["#E0B23A","#B98A18"] },
  { id:"chinese",    name:"Chinese",     icon:"🥡", color:["#C24141","#8E2A2A"] },
  { id:"maggi",      name:"Maggi",       icon:"🍜", color:["#D9A441","#A6741C"] },
  { id:"sandwich",   name:"Sandwiches",  icon:"🥪", color:["#CE8B4E","#9C5F2A"] },
  { id:"beverages",  name:"Beverages",   icon:"🥤", color:["#5C9EAD","#3A7684"] },
  { id:"momos",      name:"Momos",       icon:"🥟", color:["#B5762E","#7E4F1B"] },
  { id:"rice-roti",  name:"Rice &amp; Roti", icon:"🍚", color:["#D6B24A","#A6821C"] },
  { id:"desserts",   name:"Desserts",    icon:"🍮", color:["#C97A9A","#8E4C67"] },
  { id:"combos",     name:"Combos",      icon:"🍱", color:["#4B7A52","#2F5D34"] },
];

<script>
/* ============================================================
   KAUR'S KITCHEN — FIRESTORE CATALOG SYNC
   Keeps KK.products / KK.categories / KK.coupons / KK.offers /
   KK.config live-updated from Firestore. The static arrays
   defined in this file (data.js) act as the *seed* data — what
   a fresh Firebase project gets populated with via the admin
   portal's "Seed Database" button. Once Firestore has data,
   these listeners take over.
   ============================================================ */

/* Keep a frozen copy of the built-in seed data before Firestore
   listeners start overwriting KK.* — used by the admin portal's
   "Seed Database" and "Reset a Section" actions. */
const KK_SEED = {
  products: JSON.parse(JSON.stringify(KK.products)),
  categories: JSON.parse(JSON.stringify(KK.categories)),
  coupons: JSON.parse(JSON.stringify(KK.coupons)),
  offers: JSON.parse(JSON.stringify(KK.offers)),
  config: JSON.parse(JSON.stringify(KK.config)),
};

const KKSync = (() => {
  let onChange = () => {};
  let unsubs = [];
  const ready = { products:false, categories:false, coupons:false, offers:false, config:false };

  function setOnChange(fn){ onChange = fn; }
  function isReady(){ return Object.values(ready).every(Boolean); }

  function start(){
    unsubs.push(db.collection("products").onSnapshot(snap => {
      if(!snap.empty){ KK.products = snap.docs.map(d => d.data()); }
      ready.products = true;
      onChange();
    }, err => { console.error("products sync error:", err); ready.products = true; onChange(); }));

    unsubs.push(db.collection("categories").onSnapshot(snap => {
      if(!snap.empty){ KK.categories = snap.docs.map(d => d.data()); }
      ready.categories = true;
      onChange();
    }, err => { console.error("categories sync error:", err); ready.categories = true; onChange(); }));

    unsubs.push(db.collection("coupons").onSnapshot(snap => {
      if(!snap.empty){
        const obj = {};
        snap.docs.forEach(d => obj[d.id] = d.data());
        KK.coupons = obj;
      }
      ready.coupons = true;
      onChange();
    }, err => { console.error("coupons sync error:", err); ready.coupons = true; onChange(); }));

    unsubs.push(db.collection("offers").onSnapshot(snap => {
      if(!snap.empty){ KK.offers = snap.docs.map(d => d.data()); }
      ready.offers = true;
      onChange();
    }, err => { console.error("offers sync error:", err); ready.offers = true; onChange(); }));

    unsubs.push(db.collection("settings").doc("site").onSnapshot(doc => {
      if(doc.exists){ KK.config = Object.assign({}, KK.config, doc.data()); }
      ready.config = true;
      onChange();
    }, err => { console.error("settings sync error:", err); ready.config = true; onChange(); }));
  }

  function stop(){ unsubs.forEach(u=>u()); unsubs = []; }

  /* ---- Admin write helpers (used by admin.html) ---- */
  function saveProduct(product){ return db.collection("products").doc(product.slug).set(product); }
  function deleteProduct(slug){ return db.collection("products").doc(slug).delete(); }
  function saveCategory(cat){ return db.collection("categories").doc(cat.id).set(cat); }
  function deleteCategory(id){ return db.collection("categories").doc(id).delete(); }
  function saveCoupon(code, data){ return db.collection("coupons").doc(code).set(data); }
  function deleteCoupon(code){ return db.collection("coupons").doc(code).delete(); }
  function saveOffer(offer){ return db.collection("offers").doc(offer.id).set(offer); }
  function deleteOffer(id){ return db.collection("offers").doc(id).delete(); }
  function saveConfig(config){ return db.collection("settings").doc("site").set(config, { merge:true }); }

  /* ---- Seed / reset: writes the built-in defaults into Firestore ---- */
  function seedAll(){
    const batch = db.batch();
    KK_SEED.products.forEach(p => batch.set(db.collection("products").doc(p.slug), p));
    KK_SEED.categories.forEach(c => batch.set(db.collection("categories").doc(c.id), c));
    Object.entries(KK_SEED.coupons).forEach(([code,c]) => batch.set(db.collection("coupons").doc(code), c));
    KK_SEED.offers.forEach(o => batch.set(db.collection("offers").doc(o.id), o));
    batch.set(db.collection("settings").doc("site"), KK_SEED.config);
    return batch.commit();
  }

  function resetSection(section){
    const collMap = { products:"products", categories:"categories", coupons:"coupons", offers:"offers" };
    if(section === "config"){ return db.collection("settings").doc("site").set(KK_SEED.config); }
    const collName = collMap[section];
    return db.collection(collName).get().then(snap => {
      const batch = db.batch();
      snap.docs.forEach(d => batch.delete(d.ref));
      if(section === "products") KK_SEED.products.forEach(p => batch.set(db.collection("products").doc(p.slug), p));
      if(section === "categories") KK_SEED.categories.forEach(c => batch.set(db.collection("categories").doc(c.id), c));
      if(section === "coupons") Object.entries(KK_SEED.coupons).forEach(([code,c]) => batch.set(db.collection("coupons").doc(code), c));
      if(section === "offers") KK_SEED.offers.forEach(o => batch.set(db.collection("offers").doc(o.id), o));
      return batch.commit();
    });
  }

  return {
    start, stop, isReady, setOnChange,
    saveProduct, deleteProduct, saveCategory, deleteCategory,
    saveCoupon, deleteCoupon, saveOffer, deleteOffer, saveConfig,
    seedAll, resetSection
  };
})();

</script>

          <div class="field"><label for="loginEmail">Admin Email</label><input id="loginEmail" type="email" required autofocus></div>
          <div class="field"><label for="loginPw">Password</label><input id="loginPw" type="password" required></div>
          <button class="btn btn-primary" style="width:100%" type="submit" id="loginSubmitBtn">Login</button>
        </form>
        ${errorMsg ? `<div class="login-note" style="background:var(--maroon-tint);color:var(--maroon-deep);">${errorMsg}</div>` : ""}
        <div class="login-note">
          First time setting up? Create your admin account in the Firebase Console (Authentication → Add user),
          then add a document to the <b>admins</b> collection in Firestore with that user's UID as the document ID.
          See the setup guide for exact steps.
        </div>
      </div>
    </div>`;
  document.getElementById("loginForm").addEventListener("submit", e=>{
    e.preventDefault();
    const btn = document.getElementById("loginSubmitBtn");
    btn.disabled = true; btn.textContent = "Logging in…";
    const email = document.getElementById("loginEmail").value;
    const pw = document.getElementById("loginPw").value;
    auth.signInWithEmailAndPassword(email, pw).catch(err=>{
      renderLogin(friendlyAuthError(err));
    });
    // renderShell() is triggered by onAuthStateChanged once admin membership is confirmed.
  });
}

function checkAdminAndProceed(user){
  db.collection("admins").doc(user.uid).get().then(doc=>{
    if(doc.exists){
      adminUser = { uid:user.uid, email:user.email };
      renderShell();
    } else {
      auth.signOut();
      renderLogin(`Signed in as ${user.email}, but this account isn't authorized as an admin. Add its UID to the "admins" collection in Firestore, or sign in with a different account.`);
    }
  }).catch(err=>{
    renderLogin("Couldn't verify admin access: " + friendlyAuthError(err));
  });
}

auth.onAuthStateChanged(user => {
  if(user) checkAdminAndProceed(user);
  else { adminUser = null; renderLogin(); }
});

const NAV_ITEMS = [
  ["dashboard","Dashboard","dashboard"],
  ["products","Products","box"],
  ["categories","Categories","tag"],
  ["coupons","Coupons","ticket"],
  ["offers","Offers","megaphone"],
  ["orders","Orders","receipt"],
  ["settings","Site Settings","settings"],
  ["data","Data & Backup","database"],
];

let state = { section: "dashboard", productSearch:"", productCatFilter:"all" };
let adminOrders = [];
let adminOrdersUnsub = null;

function startAdminOrdersListener(){
  if(adminOrdersUnsub) adminOrdersUnsub();
  adminOrdersUnsub = db.collection("orders").onSnapshot(snap=>{
    adminOrders = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()))
      .sort((a,b)=> (b.date||"").localeCompare(a.date||""));
    if(state.section === "dashboard" || state.section === "orders") renderContentIfShellReady();
  }, err=>console.error("Admin orders listener error:", err));
}

function renderShell(){
  document.getElementById("app").innerHTML = `
    <div class="toast-stack" id="toastStack"></div>

        <div class="sidebar-foot">

      </aside>
      <div class="main-area">
        <header class="topbar">
          <div class="flex items-center gap-12">
            <button class="hamburger icon-btn" id="hamburgerBtn" aria-label="Menu">☰</button>
            <h1 id="topbarTitle">Dashboard</h1>
          </div>
          <div class="topbar-actions">
            <a href="index.html" target="_blank" class="btn btn-outline btn-sm">${ICON.external} View Site</a>
          </div>
        </header>
        <div class="content" id="contentArea"></div>
      </div>
    </div>`;

  const storefrontUrl = localStorage.getItem(ADMIN_STOREFRONT_KEY) || "index.html";
  document.querySelectorAll("#viewSiteLink, .topbar-actions a").forEach(a=>a.href = storefrontUrl);

  document.getElementById("sidebarNav").addEventListener("click", e=>{
    const a = e.target.closest("[data-nav]"); if(!a) return;
    e.preventDefault();
    state.section = a.dataset.nav;
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("open");
    renderContent();
  });
  document.getElementById("logoutLink").addEventListener("click", e=>{
    e.preventDefault();
    if(adminOrdersUnsub){ adminOrdersUnsub(); adminOrdersUnsub = null; }
    auth.signOut();
  });
  document.getElementById("hamburgerBtn").addEventListener("click", ()=>{
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("open");
  });
  document.getElementById("sidebarOverlay").addEventListener("click", ()=>{
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("open");
  });

  startAdminOrdersListener();

  /* Live-refresh the current table when catalog data changes elsewhere —
     but never while a form drawer is open, so we don't blow away in-progress edits. */
  KKSync.setOnChange(()=>{
    if(document.querySelector(".form-drawer.open")) return;
    renderContentIfShellReady();
  });

  renderContent();
}

function renderContentIfShellReady(){
  if(document.getElementById("contentArea")) renderContent();
}

function renderContent(){
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("active", a.dataset.nav===state.section));
  const titles = { dashboard:"Dashboard", products:"Products", categories:"Categories", coupons:"Coupons", offers:"Offers", orders:"Orders", settings:"Site Settings", data:"Data & Backup" };

  ({

function renderProducts(c){

function renderProductsTable(){
  const tbody = document.getElementById("productsTbody");
  if(!tbody) return;
  let list = KK.products;
  if(state.productCatFilter !== "all") list = list.filter(p=>p.category===state.productCatFilter);
  if(state.productSearch.trim()){
    const q = state.productSearch.trim().toLowerCase();
    list = list.filter(p=>p.name.toLowerCase().includes(q) || p.tags.some(t=>t.includes(q)));
  }
  if(!list.length){ tbody.innerHTML = `<tr class="empty-row"><td colspan="7">No products match. Try Data &amp; Backup → Seed Database if the catalog is empty.</td></tr>`; return; }

  tbody.innerHTML = list.map(p=>`
    <tr data-row="${p.slug}">
      <td><img class="row-thumb" src="${p.images[0]}" alt=""></td>
      <td><div class="cell-name">${p.name}</div><div class="cell-sub">${p.veg?'Veg':'Non-Veg'} · ${p.subcategory}</div></td>
      <td>${(KK.categories.find(c=>c.id===p.category)||{}).name || p.category}</td>
      <td>₹${p.discountPrice||p.price}${p.discountPrice?` <span class="text-faint" style="text-decoration:line-through;font-size:11.5px;">₹${p.price}</span>`:''}</td>
      <td><label class="switch"><input type="checkbox" data-toggle-available="${p.slug}" ${p.available?'checked':''}><span class="track"></span></label></td>
      <td>
        ${p.bestseller?'<span class="badge badge-marigold">Bestseller</span> ':''}
        ${p.featured?'<span class="badge badge-sage">Featured</span>':''}
        ${!p.bestseller && !p.featured ? '<span class="badge badge-gray">—</span>' : ''}
      </td>
      <td><div class="table-actions">
        <button class="icon-btn" data-edit="${p.slug}" aria-label="Edit">${ICON.edit}</button>
        <button class="icon-btn" data-del="${p.slug}" aria-label="Delete">${ICON.trash}</button>
      </div></td>
    </tr>`).join("");

  tbody.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click", ()=>openProductDrawer(KK.products.find(p=>p.slug===b.dataset.edit))));
  tbody.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click", ()=>{
    const p = KK.products.find(x=>x.slug===b.dataset.del);
    if(confirm(`Delete "${p.name}"? This can't be undone.`)){
      KKSync.deleteProduct(p.slug).then(()=>toast("Product deleted.", "success")).catch(err=>toast("Delete failed: "+err.message, "error"));
    }
  }));
  tbody.querySelectorAll("[data-toggle-available]").forEach(cb=>cb.addEventListener("change", ()=>{
    const p = KK.products.find(x=>x.slug===cb.dataset.toggleAvailable);
    const updated = Object.assign({}, p, { available: cb.checked });
    KKSync.saveProduct(updated).then(()=>toast(updated.available ? `${p.name} marked available.` : `${p.name} marked unavailable.`))
      .catch(err=>{ cb.checked = !cb.checked; toast("Update failed: "+err.message, "error"); });
  }));
}

    price:100, discountPrice:null, rating:4.5, reviewCount:0, bestseller:false, featured:false, available:true,

  };

  drawer.innerHTML = `
    <div class="form-drawer-head">
      <h3 class="section-title" style="margin:0">${isEdit?'Edit Product':'Add Product'}</h3>
      <button class="icon-btn" id="closeProductDrawer">${ICON.close}</button>
    </div>
    <div class="form-drawer-body">
      <form id="productForm">
        <div class="form-section-label">Basics</div>
        <div class="field"><label>Name</label><input name="name" required value="${escAttr(p.name)}"></div>
        <div class="field"><label>Slug (used as the product's unique ID)</label><input name="slug" value="${escAttr(p.slug||'')}" ${isEdit?'readonly style="opacity:.6;"':''}><div class="field-hint">${isEdit ? "Slug can't be changed after creation." : "Leave blank to auto-generate from name."}</div></div>
        <div class="field-row">
          <div class="field"><label>Category</label>
            <select name="category">${KK.categories.map(c=>`<option value="${c.id}" ${c.id===p.category?'selected':''}>${c.name}</option>`).join("")}</select>
          </div>
          <div class="field"><label>Subcategory Label</label><input name="subcategory" value="${escAttr(p.subcategory)}" placeholder="e.g. Chicken Specials"></div>
        </div>
        <div class="checkbox-grid">
          <label class="checkbox-row"><input type="checkbox" name="veg" ${p.veg?'checked':''}> Vegetarian</label>
          <label class="checkbox-row"><input type="checkbox" name="available" ${p.available?'checked':''}> Available</label>
          <label class="checkbox-row"><input type="checkbox" name="bestseller" ${p.bestseller?'checked':''}> Bestseller</label>
          <label class="checkbox-row"><input type="checkbox" name="featured" ${p.featured?'checked':''}> Featured</label>
        </div>

        <div class="form-section-label">Pricing &amp; Rating</div>
        <div class="field-row">
          <div class="field"><label>Price (₹)</label><input type="number" name="price" min="0" step="1" required value="${p.price}"></div>
          <div class="field"><label>Discount Price (₹, optional)</label><input type="number" name="discountPrice" min="0" step="1" value="${p.discountPrice ?? ''}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Rating (0-5)</label><input type="number" name="rating" min="0" max="5" step="0.1" value="${p.rating}"></div>
          <div class="field"><label>Review Count</label><input type="number" name="reviewCount" min="0" step="1" value="${p.reviewCount}"></div>
        </div>

        <div class="form-section-label">Details</div>
        <div class="field-row">
          <div class="field"><label>Spice Level</label>
            <select name="spicyLevel"><option value="">None</option>${["Mild","Medium","Spicy","Extra Spicy"].map(s=>`<option value="${s}" ${p.spicyLevel===s?'selected':''}>${s}</option>`).join("")}</select>
          </div>
          <div class="field"><label>Serving Size</label><input name="servingSize" value="${escAttr(p.servingSize)}" placeholder="e.g. Serves 2"></div>
        </div>
        <div class="field"><label>Preparation Time</label><input name="preparationTime" value="${escAttr(p.preparationTime)}" placeholder="e.g. 25-30 min"></div>
        <div class="field"><label>Short Description</label><input name="description" value="${escAttr(p.description)}"></div>
        <div class="field"><label>Detailed Description</label><textarea name="detailedDescription" rows="3">${p.detailedDescription||""}</textarea></div>
        <div class="field"><label>Ingredients (comma separated)</label><input name="ingredients" value="${escAttr(p.ingredients.join(", "))}"></div>
        <div class="field"><label>Tags (comma separated)</label><input name="tags" value="${escAttr(p.tags.join(", "))}"></div>

        <div class="form-section-label">Images</div>
        <div class="placeholder-gen">
          <div class="field"><label>Emoji</label><input id="genEmoji" value="🍽️" style="text-align:center;font-size:16px;"></div>
          <div class="field"><label>Color 1</label><input id="genColor1" type="color" value="#E2900C"></div>
          <div class="field"><label>Color 2</label><input id="genColor2" type="color" value="#B96F00"></div>
          <button type="button" class="btn btn-outline btn-sm" id="genImgBtn">Generate</button>
        </div>
        <div class="field"><label>Image URLs (one per line — first is the main image)</label><textarea name="images" id="imagesField" rows="3">${p.images.join("\n")}</textarea></div>
        <div class="img-preview-row" id="imgPreviewRow"></div>

        <div class="field-row">
          <div class="field"><label>Group Name</label><input name="variantName" value="${escAttr(variantGroup.name)}" placeholder="e.g. Spice Level"></div>

      </form>
    </div>

      <button class="btn btn-outline" id="cancelProductBtn">Cancel</button>
      <button class="btn btn-primary" id="saveProductBtn">Save Product</button>

  const addonRows = document.getElementById("addonRows");
  function addAddonRow(addon){
    const row = document.createElement("div");
    row.className = "repeat-row";
    row.innerHTML = `<input placeholder="Add-on name" class="addon-name" value="${escAttr((addon&&addon.name)||'')}">
      <input placeholder="₹ price" type="number" min="0" class="addon-price" style="max-width:90px" value="${addon ? addon.price : ''}">
      <button type="button" class="icon-btn remove-addon" aria-label="Remove">${ICON.close}</button>`;
    row.querySelector(".remove-addon").addEventListener("click", ()=>row.remove());
    addonRows.appendChild(row);
  }
  (p.addons||[]).forEach(addAddonRow);
  document.getElementById("addAddonRowBtn").addEventListener("click", ()=>addAddonRow(null));

  function refreshImgPreview(){
    const urls = document.getElementById("imagesField").value.split("\n").map(s=>s.trim()).filter(Boolean);
    document.getElementById("imgPreviewRow").innerHTML = urls.map(u=>`<img src="${u}" alt="">`).join("");
  }
  document.getElementById("imagesField").addEventListener("input", refreshImgPreview);
  refreshImgPreview();

  document.getElementById("genImgBtn").addEventListener("click", ()=>{
    const emoji = document.getElementById("genEmoji").value || "🍽️";
    const c1 = document.getElementById("genColor1").value;
    const c2 = document.getElementById("genColor2").value;
    const dataUri = kkPlaceholder(emoji, c1, c2);
    const field = document.getElementById("imagesField");
    field.value = field.value.trim() ? field.value.trim() + "\n" + dataUri : dataUri;
    refreshImgPreview();
  });

  document.getElementById("closeProductDrawer").addEventListener("click", closeDrawer);
  document.getElementById("cancelProductBtn").addEventListener("click", closeDrawer);

  document.getElementById("saveProductBtn").addEventListener("click", ()=>{
    const form = document.getElementById("productForm");
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const name = fd.get("name").trim();
    if(!name){ toast("Name is required.", "error"); return; }

    const images = fd.get("images").split("\n").map(s=>s.trim()).filter(Boolean);
    if(!images.length){ images.push(kkPlaceholder("🍽️","#E2900C","#B96F00")); }

    const variantName = fd.get("variantName").trim();
    const variants = variantName ? [{ name:variantName, options: csvToArr(fd.get("variantOptions")) }] : [];

    const addons = Array.from(addonRows.querySelectorAll(".repeat-row")).map((row,i)=>{
      const n = row.querySelector(".addon-name").value.trim();
      const pr = Number(row.querySelector(".addon-price").value);
      if(!n) return null;
      return { id: (p.addons && p.addons[i] && p.addons[i].id) || ("a" + Date.now() + i), name:n, price: isNaN(pr)?0:pr };
    }).filter(Boolean);

    const slug = isEdit ? p.slug : uniqueSlug(fd.get("slug").trim() || name, null);
    const record = {
      slug, id: slug, name,
      category: fd.get("category"),
      subcategory: fd.get("subcategory").trim() || ((KK.categories.find(c=>c.id===fd.get("category"))||{}).name || ""),
      veg: fd.get("veg") === "on",
      price: Number(fd.get("price")) || 0,
      discountPrice: fd.get("discountPrice") ? Number(fd.get("discountPrice")) : null,
      rating: Number(fd.get("rating")) || 0,
      reviewCount: Number(fd.get("reviewCount")) || 0,
      bestseller: fd.get("bestseller") === "on",
      featured: fd.get("featured") === "on",
      available: fd.get("available") === "on",
      spicyLevel: fd.get("spicyLevel") || null,
      servingSize: fd.get("servingSize").trim(),
      preparationTime: fd.get("preparationTime").trim(),
      description: fd.get("description").trim(),
      detailedDescription: fd.get("detailedDescription").trim(),
      ingredients: csvToArr(fd.get("ingredients")),
      tags: csvToArr(fd.get("tags")),
      images, variants, addons
    };

    const saveBtn = document.getElementById("saveProductBtn");
    saveBtn.disabled = true; saveBtn.textContent = "Saving…";
    KKSync.saveProduct(record).then(()=>{
      closeDrawer();
      toast(isEdit ? "Product updated." : "Product added.", "success");
    }).catch(err=>{
      toast("Save failed: " + err.message, "error");
      saveBtn.disabled = false; saveBtn.textContent = "Save Product";
    });
  });

  openDrawer();
}

    </div>`;

  document.getElementById("seedBtn").addEventListener("click", ()=>{
    if(!confirm("Load the starter catalog into Firestore? Existing documents with matching IDs will be overwritten.")) return;
    KKSync.seedAll().then(()=>toast("Starter catalog loaded.", "success")).catch(err=>toast("Seed failed: "+err.message, "error"));
  });

  document.getElementById("exportBtn").addEventListener("click", ()=>{
    const payload = {
      exportedAt: new Date().toISOString(),
      products: KK.products, categories: KK.categories, coupons: KK.coupons, offers: KK.offers, config: KK.config,
      orders: adminOrders
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "kaurs-kitchen-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast("Backup downloaded.", "success");
  });

  document.getElementById("importBtn").addEventListener("click", ()=>{
    const file = document.getElementById("importFile").files[0];
    if(!file){ toast("Choose a JSON file first.", "error"); return; }
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        const batch = db.batch();
        (data.products||[]).forEach(p => batch.set(db.collection("products").doc(p.slug), p));
        (data.categories||[]).forEach(cat => batch.set(db.collection("categories").doc(cat.id), cat));
        Object.entries(data.coupons||{}).forEach(([code,cp]) => batch.set(db.collection("coupons").doc(code), cp));
        (data.offers||[]).forEach(o => batch.set(db.collection("offers").doc(o.id), o));
        if(data.config) batch.set(db.collection("settings").doc("site"), data.config);
        batch.commit().then(()=>toast("Data imported.", "success")).catch(err=>toast("Import failed: "+err.message, "error"));
      }catch(e){
        toast("That file doesn't look like a valid backup.", "error");
      }
    };
    reader.readAsText(file);
  });

  c.querySelectorAll("[data-reset]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(!confirm(`Reset ${btn.dataset.reset} to defaults in Firestore? Your edits in this section will be lost.`)) return;
      KKSync.resetSection(btn.dataset.reset).then(()=>toast("Reset complete.", "success")).catch(err=>toast("Reset failed: "+err.message, "error"));
    });
  });
}

/* ================================================================
   DRAWER HELPERS
   ================================================================ */
function openDrawer(){
  document.getElementById("formOverlay").classList.add("open");
  document.querySelectorAll(".form-drawer").forEach(d=>{ if(d.innerHTML.trim()) d.classList.add("open"); });
}
function closeDrawer(){
  const overlay = document.getElementById("formOverlay");
  if(overlay) overlay.classList.remove("open");
  document.querySelectorAll(".form-drawer").forEach(d=>d.classList.remove("open"));
}
function escAttr(str){ return String(str==null?"":str).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

</script>

<script>
  KKSync.start();
</script>
