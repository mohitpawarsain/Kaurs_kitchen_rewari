/* ---------------- MENU ---------------- */
ROUTES.menu = function({ params }){
  const state = {
    query: params.get("q") || "",
    category: params.get("cat") || "all",
    vegOnly: false, nonVegOnly: false,
    sort: params.get("sort") || "recommended",
    maxPrice: 500,
    bestsellerOnly: false
  };

  const grid = document.getElementById("menuGrid");
  const resultCount = document.getElementById("resultCount");
  const searchInput = document.getElementById("menuSearchInput");
  const chipRow = document.getElementById("chipRow");
  const sortSelect = document.getElementById("sortSelect");
  const filterToggleBtn = document.getElementById("filterToggleBtn");
  const filterDrawerOverlay = document.getElementById("filterDrawerOverlay");
  const filterDrawer = document.getElementById("filterDrawer");
  const priceRange = document.getElementById("priceRange");
  const priceRangeVal = document.getElementById("priceRangeVal");

  const cats = [{id:"all", name:"All"}].concat(KK.categories.map(c=>({id:c.id,name:c.name})));
  chipRow.innerHTML = cats.map(c=>`<button class="filter-chip ${state.category===c.id?'active':''}" data-cat="${c.id}">${c.name}</button>`).join("");
  searchInput.value = state.query;
  sortSelect.value = state.sort;
  priceRange.value = state.maxPrice;
  priceRangeVal.textContent = "₹" + state.maxPrice;

  function applyFilters(){
    let list = KK.getProductsByCategory(state.category);
    if(state.query){
      const q = state.query.toLowerCase();
      list = list.filter(p =>
        p.name.toLowerCase().includes(q) ||
        p.category.includes(q) ||
        p.tags.some(t=>t.includes(q)) ||
        p.ingredients.some(i=>i.toLowerCase().includes(q))
      );
    }
    if(state.vegOnly) list = list.filter(p=>p.veg);
    if(state.nonVegOnly) list = list.filter(p=>!p.veg);
    if(state.bestsellerOnly) list = list.filter(p=>p.bestseller);
    list = list.filter(p => (p.discountPrice||p.price) <= state.maxPrice);

    switch(state.sort){
      case "price-low": list = [...list].sort((a,b)=>(a.discountPrice||a.price)-(b.discountPrice||b.price)); break;
      case "price-high": list = [...list].sort((a,b)=>(b.discountPrice||b.price)-(a.discountPrice||a.price)); break;
      case "rating": list = [...list].sort((a,b)=>b.rating-a.rating); break;
      case "popular": list = [...list].sort((a,b)=>b.reviewCount-a.reviewCount); break;
      case "newest": list = [...list].sort((a,b)=>b.id-a.id); break;
      default: list = [...list].sort((a,b)=>(b.bestseller-a.bestseller) || b.rating-a.rating);
    }
    return list;
  }

  function render(){
    KKApp.skeletonGrid(grid, 8);
    setTimeout(()=>{
      const list = applyFilters();
      resultCount.textContent = state.query
        ? `${list.length} dishes found for "${state.query}"`
        : `${list.length} dishes`;
      KKApp.renderGrid(grid, list);
    }, 200);
  }

  searchInput.addEventListener("input", debounce(()=>{ state.query = searchInput.value.trim(); render(); }, 250));
  chipRow.addEventListener("click", e=>{
    const btn = e.target.closest("[data-cat]"); if(!btn) return;
    state.category = btn.dataset.cat;
    chipRow.querySelectorAll(".filter-chip").forEach(c=>c.classList.toggle("active", c===btn));
    render();
  });
  sortSelect.addEventListener("change", ()=>{ state.sort = sortSelect.value; render(); });
  priceRange.addEventListener("input", ()=>{ state.maxPrice = Number(priceRange.value); priceRangeVal.textContent = "₹"+state.maxPrice; render(); });

  document.querySelectorAll("[data-veg-filter]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      if(cb.dataset.vegFilter==="veg"){ state.vegOnly = cb.checked; if(cb.checked){ state.nonVegOnly=false; document.querySelectorAll('[data-veg-filter="nonveg"]').forEach(x=>x.checked=false); } }
      if(cb.dataset.vegFilter==="nonveg"){ state.nonVegOnly = cb.checked; if(cb.checked){ state.vegOnly=false; document.querySelectorAll('[data-veg-filter="veg"]').forEach(x=>x.checked=false); } }
      if(cb.dataset.vegFilter==="bestseller"){ state.bestsellerOnly = cb.checked; }
      render();
    });
  });

  filterToggleBtn && filterToggleBtn.addEventListener("click", ()=>{ filterDrawerOverlay.classList.add("open"); filterDrawer.classList.add("open"); });
  filterDrawerOverlay && filterDrawerOverlay.addEventListener("click", ()=>{ filterDrawerOverlay.classList.remove("open"); filterDrawer.classList.remove("open"); });

  function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

  render();
};

/* ---------------- CART ---------------- */
ROUTES.cart = function(){
  const cfg = KK.config;
  const listEl = document.getElementById("cartList");
  const emptyEl = document.getElementById("cartEmpty");
  const summaryEl = document.getElementById("cartSummaryWrap");
  const freeDeliveryBar = document.getElementById("freeDeliveryBar");

  function render(){
    const cart = KKStore.getCart();
    if(!cart.length){
      listEl.style.display = "none";
      summaryEl.style.display = "none";
      freeDeliveryBar.style.display = "none";
      emptyEl.style.display = "block";
      return;
    }
    listEl.style.display = "block";
    summaryEl.style.display = "block";
    freeDeliveryBar.style.display = "block";
    emptyEl.style.display = "none";

    listEl.innerHTML = cart.map(line => `
      <div class="cart-item" data-key="${line.key}">
        <img src="${line.image}" alt="${line.name}">
        <div class="ci-info">
          <h4>${line.name}</h4>
          <div class="ci-opts">${[line.variant, ...line.addons.map(a=>a.name)].filter(Boolean).join(" · ") || "No customizations"}</div>
          <div class="ci-foot">
            <div class="qty-stepper"><button data-dec>−</button><span class="qty-val">${line.qty}</span><button data-inc>+</button></div>
            <div class="flex items-center gap-12">
              <b>₹${KKStore.lineTotal(line)}</b>
            </div>
          </div>
        </div>
        <button class="ci-remove" data-remove aria-label="Remove item">Remove</button>
      </div>`).join("");

    renderSummary();
  }

  function onListClick(e){
    const item = e.target.closest(".cart-item"); if(!item) return;
    const key = item.dataset.key;
    const line = KKStore.getCart().find(l=>l.key===key);
    if(e.target.closest("[data-inc]")){ KKStore.updateQty(key, line.qty+1); }
    else if(e.target.closest("[data-dec]")){ KKStore.updateQty(key, line.qty-1); }
    else if(e.target.closest("[data-remove]")){ KKStore.removeFromCart(key); kkToast("Removed from cart."); }
    render();
  }
  listEl.addEventListener("click", onListClick);

  function renderSummary(){
    const subtotal = KKStore.cartSubtotal();
    const threshold = cfg.freeDeliveryThreshold;
    const remaining = Math.max(0, threshold - subtotal);
    const pct = Math.min(100, Math.round((subtotal/threshold)*100));
    document.getElementById("fdText").textContent = remaining > 0
      ? `Add ₹${remaining} more to unlock free delivery.`
      : `🎉 You've unlocked free delivery!`;
    document.getElementById("fdProgressLabel").textContent = `₹${Math.min(subtotal,threshold)} / ₹${threshold}`;
    document.getElementById("fdFill").style.width = pct + "%";

    const deliveryFee = subtotal >= threshold ? 0 : cfg.deliveryFee;
    const discount = KKStore.couponDiscount(subtotal);
    const taxable = subtotal - discount;
    const tax = Math.round(taxable * cfg.taxRate);
    const total = taxable + tax + deliveryFee;

    document.getElementById("sumSubtotal").textContent = "₹"+subtotal;
    document.getElementById("sumDiscountRow").style.display = discount>0 ? "flex" : "none";
    document.getElementById("sumDiscount").textContent = "−₹"+discount;
    document.getElementById("sumDelivery").textContent = deliveryFee===0 ? "FREE" : "₹"+deliveryFee;
    document.getElementById("sumTax").textContent = "₹"+tax;
    document.getElementById("sumTotal").textContent = "₹"+total;

    const code = KKStore.getCoupon();
    const msg = document.getElementById("couponMsg");
    if(code && KK.coupons[code]){
      if(subtotal < KK.coupons[code].minOrder){
        msg.textContent = `Add ₹${KK.coupons[code].minOrder - subtotal} more to use ${code}.`;
        msg.className = "coupon-msg bad";
      } else {
        msg.textContent = `"${code}" applied — you saved ₹${discount}!`;
        msg.className = "coupon-msg ok";
      }
    }
  }

  document.getElementById("applyCouponBtn").addEventListener("click", ()=>{
    const input = document.getElementById("couponInput");
    const code = input.value.trim().toUpperCase();
    const msg = document.getElementById("couponMsg");
    if(!code){ return; }
    if(!KK.coupons[code]){
      msg.textContent = "Invalid coupon code. Please check and try again.";
      msg.className = "coupon-msg bad";
      return;
    }
    KKStore.setCoupon(code);
    kkToast("Coupon applied successfully.", "success");
    renderSummary();
  });

  document.addEventListener("kk:cartchange", render);
  render();

  return () => document.removeEventListener("kk:cartchange", render);
};

/* ---------------- CHECKOUT ---------------- */
ROUTES.checkout = function(){
  const cfg = KK.config;
  let step = 1;
  let selectedAddressId = null;
  let selectedPayment = "upi";

  if(!KKStore.isLoggedIn()){
    kkToast("Please login to place an order.", "error");
    kkNavigate("#/login?redirect=checkout");
    return;
  }

  const cart = KKStore.getCart();
  if(!cart.length){
    document.getElementById("checkoutFlow").style.display = "none";
    document.getElementById("checkoutEmpty").style.display = "block";
    return;
  }

  function calcTotals(){
    const subtotal = KKStore.cartSubtotal();
    const deliveryFee = subtotal >= cfg.freeDeliveryThreshold ? 0 : cfg.deliveryFee;
    const discount = KKStore.couponDiscount(subtotal);
    const tax = Math.round((subtotal - discount) * cfg.taxRate);
    const total = subtotal - discount + tax + deliveryFee;
    return { subtotal, deliveryFee, discount, tax, total };
  }

  function goStep(n){
    step = n;
    document.querySelectorAll(".checkout-panel").forEach(p => p.style.display = "none");
    document.getElementById("panel-step"+n).style.display = "block";
    document.querySelectorAll(".cstep").forEach(el=>{
      const s = Number(el.dataset.step);
      el.classList.toggle("active", s===n);
      el.classList.toggle("done", s<n);
    });
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function renderAddresses(){
    const list = KKStore.getAddresses();
    const wrap = document.getElementById("addressList");
    if(!list.length){
      wrap.innerHTML = `<p class="text-muted" style="font-size:13.5px;margin-bottom:14px;">No saved addresses yet — add one below to continue.</p>`;
    } else {
      wrap.innerHTML = list.map(a => `
        <div class="address-card ${selectedAddressId===a.id?'selected':''}" data-addr="${a.id}">
          <input type="radio" name="addrPick" ${selectedAddressId===a.id?'checked':''} style="margin-top:4px">
          <div>
            <span class="address-tag">${a.label}</span>
            <p style="font-weight:700;margin-top:6px;">${a.name} · ${a.phone}</p>
            <p class="text-muted" style="font-size:13px;">${a.house}, ${a.street}${a.landmark? ", "+a.landmark:""}, ${a.city}, ${a.state} - ${a.pincode}</p>
          </div>
        </div>`).join("");
      if(!selectedAddressId) selectedAddressId = list[0].id;
      wrap.querySelectorAll(".address-card").forEach(c=>c.classList.toggle("selected", c.dataset.addr===selectedAddressId));
    }
  }
  document.getElementById("addressList").addEventListener("click", e=>{
    const card = e.target.closest("[data-addr]"); if(!card) return;
    selectedAddressId = card.dataset.addr;
    renderAddresses();
  });
  document.getElementById("addAddressForm").addEventListener("submit", e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const addr = Object.fromEntries(fd.entries());
    KKStore.saveAddress(addr).then(saved=>{
      selectedAddressId = saved[saved.length-1].id;
      e.target.reset();
      document.getElementById("addAddressForm").style.display = "none";
      renderAddresses();
      kkToast("Address saved.", "success");
    }).catch(()=>kkToast("Couldn't save address. Please try again.", "error"));
  });
  document.getElementById("showAddAddressBtn").addEventListener("click", ()=>{
    document.getElementById("addAddressForm").style.display = "block";
  });
  document.getElementById("toStep2Btn").addEventListener("click", ()=>{
    if(!selectedAddressId){ kkToast("Please add or select a delivery address.", "error"); return; }
    renderSummaryStep();
    goStep(2);
  });

  function renderSummaryStep(){
    const totals = calcTotals();
    document.getElementById("checkoutItemsList").innerHTML = cart.map(l=>`
      <div class="summary-row"><span>${l.qty} × ${l.name}</span><span>₹${KKStore.lineTotal(l)}</span></div>`).join("");
    document.getElementById("checkoutSubtotal").textContent = "₹"+totals.subtotal;
    document.getElementById("checkoutDiscount").textContent = "−₹"+totals.discount;
    document.getElementById("checkoutDiscountRow").style.display = totals.discount>0 ? "flex":"none";
    document.getElementById("checkoutDelivery").textContent = totals.deliveryFee===0 ? "FREE" : "₹"+totals.deliveryFee;
    document.getElementById("checkoutTax").textContent = "₹"+totals.tax;
    document.getElementById("checkoutTotal").textContent = "₹"+totals.total;
    const addr = KKStore.getAddresses().find(a=>a.id===selectedAddressId);
    document.getElementById("checkoutAddrPreview").textContent = addr ? `${addr.name}, ${addr.house}, ${addr.street}, ${addr.city} - ${addr.pincode}` : "";
  }
  document.getElementById("backToStep1Btn").addEventListener("click", ()=>goStep(1));
  document.getElementById("toStep3Btn").addEventListener("click", ()=>{ renderPaymentTotals(); goStep(3); });

  document.getElementById("paymentOptions").addEventListener("click", e=>{
    const opt = e.target.closest("[data-pay]"); if(!opt) return;
    selectedPayment = opt.dataset.pay;
    document.querySelectorAll(".payment-option").forEach(p=>p.classList.toggle("selected", p===opt));
  });
  function renderPaymentTotals(){
    const totals = calcTotals();
    document.getElementById("payTotalLabel").textContent = "₹"+totals.total;
  }
  document.getElementById("backToStep2Btn").addEventListener("click", ()=>goStep(2));
  document.getElementById("placeOrderBtn").addEventListener("click", ()=>{
    const btn = document.getElementById("placeOrderBtn");
    btn.disabled = true; btn.textContent = "Placing your order…";
    const totals = calcTotals();
    const addr = KKStore.getAddresses().find(a=>a.id===selectedAddressId);
    KKStore.placeOrder({
      items: cart, address: addr, payment: selectedPayment, coupon: KKStore.getCoupon(),
      subtotal: totals.subtotal, discount: totals.discount, tax: totals.tax, deliveryFee: totals.deliveryFee, total: totals.total
    }).then(order=>{
      KKStore.clearCart();
      renderConfirmation(order);
      goStep(4);
      btn.disabled = false; btn.textContent = "Place Order";
    }).catch(err=>{
      console.error(err);
      kkToast("Couldn't place your order. Please check your connection and try again.", "error");
      btn.disabled = false; btn.textContent = "Place Order";
    });
  });

  function renderConfirmation(order){
    document.getElementById("confirmOrderId").textContent = order.id;
    document.getElementById("confirmTotal").textContent = "₹"+order.total;
    document.getElementById("confirmItems").textContent = order.items.reduce((s,l)=>s+l.qty,0) + " items";
    document.getElementById("confirmAddress").textContent = order.address ? `${order.address.house}, ${order.address.street}, ${order.address.city}` : "—";
    document.getElementById("confirmEta").textContent = "35-45 minutes";
    document.getElementById("trackOrderLink").href = "#/account?tab=orders&order=" + order.id;
  }

  renderAddresses();
  goStep(1);
};

/* ---------------- AUTH: LOGIN / SIGNUP / FORGOT PASSWORD ---------------- */
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function showFieldError(field, msg){ field.classList.add("invalid"); const err = field.querySelector(".field-error"); if(err) err.textContent = msg; }
function clearFieldError(field){ field.classList.remove("invalid"); }
function friendlyAuthError(err){
  const map = {
    "auth/invalid-email": "That doesn't look like a valid email address.",
    "auth/user-disabled": "This account has been disabled.",
    "auth/user-not-found": "No account found with that email.",
    "auth/wrong-password": "Incorrect password.",
    "auth/invalid-credential": "Incorrect email or password.",
    "auth/email-already-in-use": "An account with that email already exists.",
    "auth/weak-password": "Password is too weak — use at least 6 characters.",
    "auth/network-request-failed": "Network error — check your connection and try again.",
    "auth/too-many-requests": "Too many attempts. Please wait a moment and try again."
  };
  return (err && map[err.code]) || (err && err.message) || "Something went wrong. Please try again.";
}

ROUTES.login = function({ params }){
  document.querySelectorAll(".google-btn").forEach(btn=>btn.addEventListener("click", ()=>kkToast("Google sign-in isn't connected in this preview.")));
  const loginForm = document.getElementById("loginForm");
  loginForm.addEventListener("submit", e=>{
    e.preventDefault();
    const email = loginForm.querySelector("[name=email]");
    const pass = loginForm.querySelector("[name=password]");
    [email,pass].forEach(f=>clearFieldError(f.closest(".field")));
    let ok = true;
    if(!validEmail(email.value)){ showFieldError(email.closest(".field"), "Enter a valid email address."); ok=false; }
    if(pass.value.length < 1){ showFieldError(pass.closest(".field"), "Please enter your password."); ok=false; }
    if(!ok) return;

    const submitBtn = loginForm.querySelector("button[type=submit]");
    submitBtn.disabled = true; submitBtn.textContent = "Logging in…";
    KKStore.login(email.value, pass.value).then(()=>{
      kkToast("Welcome back!", "success");
      const redirect = params.get("redirect");
      kkNavigate("#/" + (redirect || "account"));
    }).catch(err=>{
      kkToast(friendlyAuthError(err), "error");
      submitBtn.disabled = false; submitBtn.textContent = "Login";
    });
  });
};

ROUTES.signup = function(){
  document.querySelectorAll(".google-btn").forEach(btn=>btn.addEventListener("click", ()=>kkToast("Google sign-in isn't connected in this preview.")));
  const signupForm = document.getElementById("signupForm");
  signupForm.addEventListener("submit", e=>{
    e.preventDefault();
    let ok = true;
    const name = signupForm.querySelector("[name=name]");
    const email = signupForm.querySelector("[name=email]");
    const pass = signupForm.querySelector("[name=password]");
    const confirm = signupForm.querySelector("[name=confirmPassword]");
    [name,email,pass,confirm].forEach(f=>clearFieldError(f.closest(".field")));

    if(name.value.trim().length < 2){ showFieldError(name.closest(".field"), "Please enter your full name."); ok=false; }
    if(!validEmail(email.value)){ showFieldError(email.closest(".field"), "Enter a valid email address."); ok=false; }
    if(pass.value.length < 6){ showFieldError(pass.closest(".field"), "Password must be at least 6 characters."); ok=false; }
    if(confirm.value !== pass.value){ showFieldError(confirm.closest(".field"), "Passwords do not match."); ok=false; }
    if(!ok) return;

    const submitBtn = signupForm.querySelector("button[type=submit]");
    submitBtn.disabled = true; submitBtn.textContent = "Creating account…";
    KKStore.signup(email.value, pass.value, name.value.trim()).then(()=>{
      document.getElementById("signupStep").style.display = "none";
      document.getElementById("verifyStep").style.display = "block";
    }).catch(err=>{
      kkToast(friendlyAuthError(err), "error");
      submitBtn.disabled = false; submitBtn.textContent = "Create Account";
    });
  });
  document.getElementById("resendVerifyBtn").addEventListener("click", ()=>{
    const user = firebase.auth().currentUser;
    if(user){ user.sendEmailVerification().then(()=>kkToast("Verification email resent.")).catch(()=>kkToast("Couldn't resend right now.", "error")); }
  });
  document.getElementById("continueAfterVerifyBtn").addEventListener("click", ()=>{ kkNavigate("#/account"); });
};

ROUTES["forgot-password"] = function(){
  const forgotForm = document.getElementById("forgotForm");
  forgotForm.addEventListener("submit", e=>{
    e.preventDefault();
    const email = forgotForm.querySelector("[name=email]");
    if(!validEmail(email.value)){ showFieldError(email.closest(".field"), "Enter a valid email address."); return; }
    const submitBtn = forgotForm.querySelector("button[type=submit]");
    submitBtn.disabled = true; submitBtn.textContent = "Sending…";
    KKStore.sendPasswordReset(email.value).then(()=>{
      document.getElementById("forgotFormWrap").style.display = "none";
      document.getElementById("forgotSentWrap").style.display = "block";
    }).catch(err=>{
      // Don't reveal whether the email exists — still show the "check your inbox" state
      document.getElementById("forgotFormWrap").style.display = "none";
      document.getElementById("forgotSentWrap").style.display = "block";
    }).finally(()=>{
      submitBtn.disabled = false; submitBtn.textContent = "Send Reset Link";
    });
  });
};

/* ---------------- ACCOUNT ---------------- */
ROUTES.account = function({ params }){
  const user = KKStore.getUser();

  if(!user){
    document.getElementById("accountGate").style.display = "block";
    document.getElementById("accountDashboard").style.display = "none";
    return;
  }
  document.getElementById("accountGate").style.display = "none";
  document.getElementById("accountDashboard").style.display = "grid";

  document.getElementById("acctName").textContent = user.name;
  document.getElementById("acctEmail").textContent = user.email;
  document.getElementById("acctAvatar").textContent = user.name[0].toUpperCase();
  document.getElementById("profileName").value = user.name;
  document.getElementById("profileEmail").value = user.email;

  const tabs = ["profile","orders","wishlist","addresses","settings"];
  function showTab(tab){
    tabs.forEach(t=>{
      document.getElementById("panel-"+t).style.display = (t===tab) ? "block" : "none";
      document.getElementById("nav-"+t).classList.toggle("active", t===tab);
    });
    history.replaceState(null,"","#/account?tab="+tab);
  }
  tabs.forEach(t=>{
    document.getElementById("nav-"+t).addEventListener("click", e=>{ e.preventDefault(); showTab(t); });
  });
  showTab(tabs.includes(params.get("tab")) ? params.get("tab") : "profile");

  document.getElementById("logoutBtn").addEventListener("click", (e)=>{
    e.preventDefault();
    KKStore.logout();
    kkToast("Logged out.");
    kkNavigate("#/");
  });

  document.getElementById("profileForm").addEventListener("submit", e=>{
    e.preventDefault();
    kkToast("Profile updated.", "success");
  });

  const STATUS_STEPS = ["Order Placed","Order Confirmed","Preparing Your Food","Out for Delivery","Delivered"];
  function renderOrders(){
    const orders = KKStore.getOrders();
    const wrap = document.getElementById("ordersList");
    if(!orders.length){
      wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">🧾</div><h3>No orders yet</h3><p>Once you place an order, it'll show up here with live tracking.</p><a href="#/menu" class="btn btn-primary">Explore Menu</a></div>`;
      return;
    }
    wrap.innerHTML = orders.map(o => orderCardHTML(o)).join("");
    bindOrderEvents();
    const focusId = params.get("order");
    if(focusId && document.getElementById("track-"+focusId)){ document.getElementById("track-"+focusId).style.display = "block"; }
  }
  function statusClass(s){
    if(s==="Delivered") return "status-delivered";
    if(s==="Cancelled") return "status-cancelled";
    return "status-preparing";
  }
  function orderCardHTML(o){
    const stepIndex = STATUS_STEPS.indexOf(o.status);
    return `
    <div class="order-card">
      <div class="order-card-top">
        <div><b>#${o.id}</b><p class="text-faint" style="font-size:12px;">${new Date(o.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})} · ${o.items.reduce((s,l)=>s+l.qty,0)} items</p></div>
        <span class="status-pill ${statusClass(o.status)}">${o.status}</span>
      </div>
      <p class="text-muted" style="font-size:13px;margin-bottom:10px;">${o.items.map(l=>l.qty+"× "+l.name).join(", ")}</p>
      <div class="flex justify-between items-center">
        <b>₹${o.total}</b>
        <div class="flex gap-8">
          <button class="btn btn-outline btn-sm" data-track="${o.id}">Track Order</button>
          <button class="btn btn-ghost btn-sm" data-reorder="${o.id}">Order Again</button>
        </div>
      </div>
      <div id="track-${o.id}" style="display:none;margin-top:18px;">
        <hr class="divider">
        <div class="timeline">
          ${STATUS_STEPS.map((s,i)=>`
            <div class="tl-item ${i<stepIndex?'done':''} ${i===stepIndex?'active':''}">
              <h5>${s}</h5><span>${i<=stepIndex ? 'Completed' : 'Pending'}</span>
            </div>`).join("")}
        </div>
        ${stepIndex < STATUS_STEPS.length-1 ? `<p class="text-faint" style="font-size:12px;">Estimated delivery in 35-45 minutes.</p>` : ''}
      </div>
    </div>`;
  }
  function bindOrderEvents(){
    document.querySelectorAll("[data-track]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const el = document.getElementById("track-"+btn.dataset.track);
        el.style.display = el.style.display === "none" ? "block" : "none";
      });
    });
    document.querySelectorAll("[data-reorder]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const order = KKStore.getOrders().find(o=>o.id===btn.dataset.reorder);
        let unavailable = [];
        order.items.forEach(line=>{
          const product = KK.products.find(p=>p.id===line.productId);
          if(!product || !product.available){ unavailable.push(line.name); return; }
          KKStore.addToCart(product, { qty: line.qty, variant: line.variant, addonIds: (line.addons||[]).map(a=>a.id) });
        });
        if(unavailable.length){ kkToast("Some items are currently unavailable.", "error"); }
        else { kkToast("Items added to your cart.", "success"); }
      });
    });
  }
  renderOrders();
  document.addEventListener("kk:orderschange", renderOrders);

  function renderWishlist(){
    const ids = KKStore.getWishlist();
    const products = ids.map(id=>KK.products.find(p=>p.id===id)).filter(Boolean);
    const grid = document.getElementById("wishlistGrid");
    if(!products.length){
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">💛</div><h3>Save your favourites here</h3><p>Tap the heart icon on any dish to add it to your wishlist.</p><a href="#/menu" class="btn btn-primary">Explore Menu</a></div>`;
      return;
    }
    KKApp.renderGrid(grid, products);
  }
  document.addEventListener("kk:wishlistchange", renderWishlist);
  renderWishlist();

  function renderAddresses(){
    const list = KKStore.getAddresses();
    const wrap = document.getElementById("addressManageList");
    if(!list.length){
      wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">📍</div><h3>No saved addresses</h3><p>Add a delivery address to speed up checkout next time.</p></div>`;
    } else {
      wrap.innerHTML = list.map(a=>`
        <div class="address-manage-card">
          <div>
            <span class="address-tag">${a.label}</span>
            <p style="font-weight:700;margin-top:6px;">${a.name} · ${a.phone}</p>
            <p class="text-muted" style="font-size:13px;">${a.house}, ${a.street}${a.landmark?', '+a.landmark:''}, ${a.city}, ${a.state} - ${a.pincode}</p>
          </div>
          <button class="icon-btn" data-del-addr="${a.id}" aria-label="Delete address">✕</button>
        </div>`).join("");
      wrap.querySelectorAll("[data-del-addr]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          KKStore.deleteAddress(btn.dataset.delAddr).then(()=>kkToast("Address removed.")).catch(()=>kkToast("Couldn't remove address.", "error"));
        });
      });
    }
  }
  document.getElementById("acctAddAddressForm").addEventListener("submit", e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    KKStore.saveAddress(Object.fromEntries(fd.entries())).then(()=>{
      e.target.reset();
      kkToast("Address saved.", "success");
    }).catch(()=>kkToast("Couldn't save address.", "error"));
  });
  document.addEventListener("kk:addresseschange", renderAddresses);
  renderAddresses();

  return () => {
    document.removeEventListener("kk:wishlistchange", renderWishlist);
    document.removeEventListener("kk:orderschange", renderOrders);
    document.removeEventListener("kk:addresseschange", renderAddresses);
  };
};

/* ---------------- SEARCH ---------------- */
ROUTES.search = function({ params }){
  const input = document.getElementById("searchInput");
  const resultsWrap = document.getElementById("searchResultsWrap");
  const popularWrap = document.getElementById("popularSearchesWrap");
  const popularTerms = ["Chicken","Paneer","Momos","Cold Coffee","Mutton","Maggi"];

  document.getElementById("popularSearchChips").innerHTML = popularTerms.map(t=>`<button class="filter-chip" data-term="${t}">${t}</button>`).join("");
  document.getElementById("popularSearchChips").addEventListener("click", e=>{
    const btn = e.target.closest("[data-term]"); if(!btn) return;
    input.value = btn.dataset.term;
    runSearch(btn.dataset.term);
  });
  KKApp.renderGrid(document.getElementById("popularSearchGrid"), KK.getBestsellers().slice(0,8));

  function runSearch(q){
    q = q.trim();
    history.replaceState(null, "", "#/search?q=" + encodeURIComponent(q));
    if(!q){
      resultsWrap.style.display = "none";
      popularWrap.style.display = "block";
      return;
    }
    resultsWrap.style.display = "block";
    popularWrap.style.display = "none";
    const ql = q.toLowerCase();
    const results = KK.products.filter(p =>
      p.name.toLowerCase().includes(ql) || p.category.includes(ql) ||
      p.tags.some(t=>t.includes(ql)) || p.ingredients.some(i=>i.toLowerCase().includes(ql))
    );
    document.getElementById("searchResultCount").textContent = `Search results for "${q}" — ${results.length} dishes found`;
    KKApp.renderGrid(document.getElementById("searchGrid"), results);
  }

  let debounceT;
  input.addEventListener("input", ()=>{ clearTimeout(debounceT); debounceT = setTimeout(()=>runSearch(input.value), 250); });

  const initialQ = params.get("q") || "";
  input.value = initialQ;
  runSearch(initialQ);
};

ROUTES.offers = function(){
  document.getElementById("offersList").innerHTML = KK.offers.map(o=>`
    <div class="offer-detail-card">
      <div style="flex:1;">
        <span class="eyebrow">${o.badge}</span>
        <h3>${o.title}</h3>
        <p class="text-muted" style="font-size:13.5px;margin-top:6px;">${o.desc}</p>
      </div>
      ${o.code ? `<div class="offer-code-box">${o.code}</div>` : `<a href="#/menu" class="btn btn-outline btn-sm">Order Now</a>`}
    </div>`).join("");

  document.getElementById("couponsList").innerHTML = Object.entries(KK.coupons).map(([code,c])=>`
    <div class="offer-detail-card">
      <div style="flex:1;">
        <div class="offer-code-box mb-8" style="display:inline-flex;">${code}</div>
        <p class="text-muted" style="font-size:13.5px;">${c.desc}</p>
      </div>
      <a href="#/menu" class="btn btn-ghost btn-sm">Order Now</a>
    </div>`).join("");

  function renderCountdown(){
    const now = new Date();
    const end = new Date(); end.setHours(23,59,59,999);
    let diff = Math.max(0, end - now);
    const h = String(Math.floor(diff/3.6e6)).padStart(2,"0");
    const m = String(Math.floor((diff%3.6e6)/6e4)).padStart(2,"0");
    const s = String(Math.floor((diff%6e4)/1000)).padStart(2,"0");
    const el = document.getElementById("countdown1");
    if(el) el.innerHTML = `<div>${h}<br><span style="font-weight:600;font-size:9px;">HRS</span></div><div>${m}<br><span style="font-weight:600;font-size:9px;">MIN</span></div><div>${s}<br><span style="font-weight:600;font-size:9px;">SEC</span></div>`;
  }
  renderCountdown();
  const intervalId = setInterval(renderCountdown, 1000);
  return () => clearInterval(intervalId);
};
