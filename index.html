/* ============================================================
   KAUR'S KITCHEN — DESIGN SYSTEM
   Palette: turmeric marigold + brick maroon on warm cream
   Type: Fraunces (display) + Inter (body/UI)
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  /* ---- color tokens ---- */
  --cream:        #FBF3E6;
  --cream-deep:   #F3E5CE;
  --paper:        #FFFDF9;
  --ink:          #2A2016;
  --ink-soft:     #6E5F4E;
  --ink-faint:    #9C8D7A;
  --marigold:     #E2900C;
  --marigold-deep:#B96F00;
  --marigold-tint:#FDF0D9;
  --maroon:       #9A3324;
  --maroon-deep:  #7A2519;
  --maroon-tint:  #FBE7E2;
  --sage:         #4B7A52;
  --sage-tint:    #E7F1E5;
  --white:        #FFFFFF;
  --line:         rgba(42,32,22,0.10);
  --line-strong:  rgba(42,32,22,0.16);
  --shadow-sm:    0 2px 10px rgba(42,32,22,0.06);
  --shadow-md:    0 10px 28px rgba(42,32,22,0.10);
  --shadow-lg:    0 24px 60px rgba(42,32,22,0.16);

  /* ---- radii ---- */
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-xl: 32px;
  --r-pill: 999px;

  /* ---- type ---- */
  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', sans-serif;

  /* ---- layout ---- */
  --header-h: 76px;
  --header-h-mobile: 62px;
  --bottom-nav-h: 64px;
  --container: 1240px;

  /* ---- motion ---- */
  --ease: cubic-bezier(.22,.68,0,1);
  --fast: .18s;
  --med: .32s;
  --slow: .6s;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  font-family: var(--font-body);
  background: var(--cream);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
  padding-bottom: env(safe-area-inset-bottom);
}
img{ max-width:100%; display:block; }
a{ color: inherit; text-decoration:none; }
button{ font-family: inherit; cursor:pointer; }
input,select,textarea{ font-family: inherit; }
ul{ list-style:none; margin:0; padding:0; }
h1,h2,h3,h4{ font-family: var(--font-display); margin:0; color: var(--ink); font-weight:600; letter-spacing:-.01em; }
p{ margin:0; }

.container{ max-width: var(--container); margin:0 auto; padding:0 20px; }
@media (min-width:900px){ .container{ padding:0 40px; } }

/* Visible focus states for accessibility */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline: 2.5px solid var(--marigold-deep);
  outline-offset: 2px;
  border-radius: 6px;
}
.skip-link{
  position:absolute; left:-999px; top:0; background:var(--ink); color:var(--white); padding:10px 16px; border-radius: 0 0 8px 0; z-index:999;
}
.skip-link:focus{ left:0; }

/* ============ TYPE SCALE ============ */
.eyebrow{
  font-family: var(--font-body); font-weight:700; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color: var(--maroon);
  display:inline-flex; align-items:center; gap:8px;
}
.eyebrow::before{ content:''; width:18px; height:1.5px; background: var(--marigold); display:inline-block; }
.h-xl{ font-size: clamp(34px,6vw,64px); line-height:1.03; }
.h-lg{ font-size: clamp(28px,4vw,42px); line-height:1.08; }
.h-md{ font-size: clamp(22px,3vw,28px); line-height:1.15; }
.h-sm{ font-size: 19px; line-height:1.25; }
.text-muted{ color: var(--ink-soft); }
.text-faint{ color: var(--ink-faint); }

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-weight:700; font-size:15px; border:none; border-radius: var(--r-pill);
  padding: 14px 26px; transition: transform var(--fast) var(--ease), box-shadow var(--fast) var(--ease), background var(--fast) var(--ease);
  white-space:nowrap;
}
.btn:active{ transform: scale(.96); }
.btn-primary{ background: var(--marigold); color: var(--white); box-shadow: 0 8px 20px rgba(226,144,12,.32); }
.btn-primary:hover{ background: var(--marigold-deep); box-shadow: 0 10px 26px rgba(185,111,0,.4); transform: translateY(-2px); }
.btn-dark{ background: var(--ink); color: var(--cream); }
.btn-dark:hover{ transform: translateY(-2px); box-shadow: var(--shadow-md); }
.btn-outline{ background: transparent; color: var(--ink); border: 1.5px solid var(--line-strong); }
.btn-outline:hover{ border-color: var(--ink); background: var(--white); }
.btn-ghost{ background: var(--white); color: var(--ink); box-shadow: var(--shadow-sm); }
.btn-ghost:hover{ box-shadow: var(--shadow-md); transform: translateY(-2px); }
.btn-sm{ padding:9px 16px; font-size:13.5px; }
.btn-block{ width:100%; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; transform:none !important; }
.btn-icon{ width:44px; height:44px; padding:0; border-radius:50%; background:var(--white); box-shadow: var(--shadow-sm); }
.btn-icon:hover{ box-shadow: var(--shadow-md); }

/* ============ HEADER ============ */
.site-header{
  position: sticky; top:0; z-index: 500;
  height: var(--header-h);
  display:flex; align-items:center;
  background: rgba(251,243,230,0.5);
  transition: background var(--med) var(--ease), box-shadow var(--med) var(--ease), backdrop-filter var(--med) var(--ease), height var(--med) var(--ease);
}
.site-header.is-scrolled{
  background: rgba(251,243,230,0.86);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 6px 24px rgba(42,32,22,.08);
}
.header-inner{ display:flex; align-items:center; justify-content:space-between; gap:24px; width:100%; }
.brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
.brand-mark{
  width:42px; height:42px; border-radius:50%; background: conic-gradient(from 200deg, var(--marigold), var(--maroon), var(--marigold));
  display:flex; align-items:center; justify-content:center; color:var(--white); font-family:var(--font-display); font-weight:700; font-size:16px;
  box-shadow: 0 4px 12px rgba(154,51,36,.28);
}
.brand-text{ display:flex; flex-direction:column; line-height:1.1; }
.brand-text b{ font-family: var(--font-display); font-size:19px; font-weight:700; color: var(--maroon-deep); }
.brand-text span{ font-size:10.5px; color: var(--ink-soft); letter-spacing:.03em; }

.main-nav{ display:none; }
@media (min-width: 980px){
  .main-nav{ display:flex; align-items:center; gap:6px; }
  .main-nav a{
    padding:10px 16px; border-radius: var(--r-pill); font-weight:600; font-size:14.5px; color: var(--ink-soft);
    transition: background var(--fast), color var(--fast);
  }
  .main-nav a:hover, .main-nav a.active{ background: var(--white); color: var(--maroon-deep); box-shadow: var(--shadow-sm); }
}

.header-actions{ display:flex; align-items:center; gap:10px; }
.header-search{
  display:none; align-items:center; gap:8px; background: var(--white); border-radius: var(--r-pill);
  padding: 9px 16px; box-shadow: var(--shadow-sm); width: 230px; transition: width var(--med) var(--ease), box-shadow var(--fast);
  border:1px solid transparent;
}
.header-search:focus-within{ width:290px; border-color: var(--marigold); }
.header-search input{ border:none; outline:none; background:transparent; font-size:14px; width:100%; color:var(--ink); }
@media (min-width:980px){ .header-search{ display:flex; } }

.icon-btn{
  position:relative; width:42px; height:42px; border-radius:50%; background: var(--white); border:none;
  display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-sm); color: var(--ink);
  transition: transform var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
}
.icon-btn:hover{ transform: translateY(-2px); box-shadow: var(--shadow-md); }
.icon-btn .badge{
  position:absolute; top:-4px; right:-4px; background: var(--maroon); color:var(--white); font-size:10px; font-weight:800;
  min-width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0 3px;
  border: 2px solid var(--cream); transition: transform var(--fast) var(--ease);
}
.icon-btn .badge.pulse{ animation: badgepop .35s var(--ease); }
@keyframes badgepop{ 0%{transform:scale(0)} 60%{transform:scale(1.25)} 100%{transform:scale(1)} }

.mobile-only{ display:flex; }
.desktop-only{ display:none; }
@media (min-width:980px){ .mobile-only{ display:none; } .desktop-only{ display:flex; } }

/* ============ MOBILE MENU DRAWER ============ */
.drawer-overlay{
  position:fixed; inset:0; background: rgba(20,14,8,.42); backdrop-filter: blur(2px); z-index: 900;
  opacity:0; pointer-events:none; transition: opacity var(--med) var(--ease);
}
.drawer-overlay.open{ opacity:1; pointer-events:auto; }
.drawer{
  position:fixed; top:0; right:0; height:100%; width: min(400px, 88vw); background: var(--paper); z-index:901;
  box-shadow: -20px 0 50px rgba(0,0,0,.18); transform: translateX(105%); transition: transform var(--med) var(--ease);
  display:flex; flex-direction:column;
}
.drawer.open{ transform: translateX(0); }
.drawer.from-left{ left:0; right:auto; transform: translateX(-105%); }
.drawer.from-left.open{ transform: translateX(0); }
.drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line); }
.drawer-body{ padding:16px 20px; overflow-y:auto; flex:1; }
.drawer-nav a{ display:block; padding:14px 6px; font-weight:600; font-size:16px; border-bottom:1px solid var(--line); color: var(--ink); }

/* ============ FLOATING BUTTONS ============ */
.floating-stack{
  position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 400;
  display:flex; flex-direction:column; align-items:flex-end; gap:12px;
}
@media (max-width: 719px){ .floating-stack{ bottom: calc(var(--bottom-nav-h) + 76px + env(safe-area-inset-bottom)); } }

.fab{
  width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow-lg); border:none; position:relative; transition: transform var(--fast) var(--ease);
}
.fab:hover{ transform: translateY(-3px) scale(1.04); }
.fab-whatsapp{ background:#25D366; color:#fff; }
.fab-whatsapp::after{
  content:''; position:absolute; inset:-6px; border-radius:50%; border:2px solid #25D366; opacity:.55;
  animation: pulsering 2.4s ease-out infinite;
}
@keyframes pulsering{ 0%{ transform:scale(.85); opacity:.55; } 100%{ transform:scale(1.35); opacity:0; } }
.fab-help{ background: var(--ink); color: var(--cream); }
.fab-tooltip{
  position:absolute; right:66px; top:50%; transform: translateY(-50%) translateX(6px); background: var(--ink); color: var(--cream);
  padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; white-space:nowrap; opacity:0; pointer-events:none;
  transition: opacity var(--fast) var(--ease), transform var(--fast) var(--ease);
}
.fab:hover .fab-tooltip{ opacity:1; transform: translateY(-50%) translateX(0); }

.floating-cart{
  display:flex; align-items:center; gap:12px; background: var(--maroon); color:var(--white); border:none;
  border-radius: var(--r-pill); padding: 12px 20px 12px 14px; box-shadow: 0 14px 30px rgba(154,51,36,.35);
  transform: translateY(120%) scale(.9); opacity:0; transition: transform var(--med) var(--ease), opacity var(--med) var(--ease);
}
.floating-cart.show{ transform: translateY(0) scale(1); opacity:1; }
.floating-cart .fc-icon{ width:34px; height:34px; border-radius:50%; background: rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; }
.floating-cart .fc-text{ text-align:left; line-height:1.2; }
.floating-cart .fc-text b{ display:block; font-size:14.5px; }
.floating-cart .fc-text span{ font-size:11.5px; opacity:.85; }

/* Help popup */
.help-popup{
  position:absolute; bottom:66px; right:0; background: var(--paper); border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  width:220px; padding:14px; opacity:0; pointer-events:none; transform: translateY(10px) scale(.96); transform-origin: bottom right;
  transition: all var(--fast) var(--ease);
}
.help-popup.open{ opacity:1; pointer-events:auto; transform: translateY(0) scale(1); }
.help-popup h4{ font-size:14px; margin-bottom:8px; }
.help-popup a{ display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:10px; font-size:13.5px; font-weight:600; }
.help-popup a:hover{ background: var(--cream-deep); }

/* ============ BOTTOM NAV (mobile) ============ */
.bottom-nav{
  position: fixed; left:0; right:0; bottom:0; z-index: 450; height: var(--bottom-nav-h);
  background: var(--paper); border-top: 1px solid var(--line); display:flex; padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -6px 24px rgba(42,32,22,.06);
}
@media (min-width: 720px){ .bottom-nav, .mobile-cart-bar{ display:none !important; } }
.bottom-nav a{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10.5px; font-weight:700; color: var(--ink-faint);
}
.bottom-nav a svg{ transition: transform var(--fast) var(--ease); }
.bottom-nav a.active{ color: var(--maroon); }
.bottom-nav a.active svg{ transform: translateY(-2px) scale(1.08); }
.bottom-nav a.active::before{ content:''; position:absolute; }

.mobile-cart-bar{
  position: fixed; left:12px; right:12px; bottom: calc(var(--bottom-nav-h) + 10px + env(safe-area-inset-bottom)); z-index: 440;
  background: var(--maroon); color:var(--white); border-radius: var(--r-lg); padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
  box-shadow: 0 14px 30px rgba(154,51,36,.35); transform: translateY(140%); opacity:0; transition: all var(--med) var(--ease);
}
.mobile-cart-bar.show{ transform: translateY(0); opacity:1; }
.mobile-cart-bar b{ font-size:14px; }
.mobile-cart-bar span{ font-size:11.5px; opacity:.85; display:block; }

body.has-bottom-nav{ padding-bottom: calc(var(--bottom-nav-h) + 8px); }

/* ============ HERO ============ */
.hero{ position:relative; overflow:hidden; padding: 42px 0 70px; }
.hero-grid{ display:grid; gap:36px; align-items:center; }
@media (min-width: 900px){ .hero-grid{ grid-template-columns: 1.05fr .95fr; gap: 48px; } }
.hero-copy{ position:relative; z-index:2; }
.hero-title{ margin: 14px 0 10px; }
.hero-title em{ font-style: italic; color: var(--maroon); }
.hero-tagline{ font-family: var(--font-display); font-style:italic; font-size: clamp(17px,2.4vw,21px); color: var(--marigold-deep); margin: 6px 0 16px; }
.hero-sub{ max-width: 480px; font-size:16px; color: var(--ink-soft); margin-bottom:26px; }
.hero-ctas{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom: 30px;}
.hero-stats{ display:flex; gap:28px; flex-wrap:wrap; }
.hero-stat b{ font-family: var(--font-display); font-size:24px; display:block; color: var(--maroon-deep); }
.hero-stat span{ font-size:12.5px; color: var(--ink-soft); }

.hero-visual{ position:relative; }
.hero-plate{
  position:relative; border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%; overflow:hidden; box-shadow: var(--shadow-lg);
  animation: floaty 6s ease-in-out infinite; aspect-ratio: 1/1; max-width:460px; margin:0 auto;
  border: 6px solid var(--white);
}
@keyframes floaty{ 0%,100%{ transform: translateY(0) rotate(0deg);} 50%{ transform: translateY(-14px) rotate(1.2deg);} }
.hero-badge{
  position:absolute; background: var(--white); border-radius: var(--r-lg); box-shadow: var(--shadow-md); padding:12px 16px; display:flex; align-items:center; gap:10px;
  animation: fadeUp .8s var(--ease) both; font-size:13px; font-weight:700;
}
.hero-badge.b1{ top: 6%; left: -6%; animation-delay:.2s; }
.hero-badge.b2{ bottom: 8%; right: -8%; animation-delay:.5s; }
.hero-badge .dot{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:17px; }
@media (max-width: 899px){ .hero-badge{ display:none; } }

.steam-divider{ display:block; width:100%; height:44px; margin-top:-2px; color: var(--paper); }

@keyframes fadeUp{ from{ opacity:0; transform: translateY(16px);} to{ opacity:1; transform: translateY(0);} }
@keyframes fadeIn{ from{ opacity:0;} to{ opacity:1;} }
.reveal{ opacity:0; transform: translateY(22px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
.reveal.in{ opacity:1; transform: translateY(0); }

/* ============ SECTIONS ============ */
.section{ padding: 56px 0; }
.section-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom: 26px; flex-wrap:wrap; }
.section-head .view-all{ font-weight:700; font-size:13.5px; color: var(--maroon-deep); display:flex; align-items:center; gap:6px; }
.bg-cream-deep{ background: var(--cream-deep); }
.bg-paper{ background: var(--paper); }

/* Category rail */
.cat-rail{ display:flex; gap:16px; overflow-x:auto; padding: 6px 2px 18px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
.cat-rail::-webkit-scrollbar{ display:none; }
@media (min-width: 900px){ .cat-rail{ display:grid; grid-template-columns: repeat(6,1fr); overflow:visible; } }
.cat-card{
  flex: 0 0 108px; scroll-snap-align:start; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
  transition: transform var(--fast) var(--ease);
}
@media (min-width:900px){ .cat-card{ flex:auto; } }
.cat-card:hover{ transform: translateY(-4px); }
.cat-ring{
  width:78px; height:78px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px;
  background: var(--white); box-shadow: var(--shadow-sm); border: 2px solid transparent; transition: border-color var(--fast), box-shadow var(--fast);
}
.cat-card:hover .cat-ring{ border-color: var(--marigold); box-shadow: var(--shadow-md); }
.cat-card span{ font-size:12.5px; font-weight:700; color: var(--ink-soft); }

/* Product grid & card */
.product-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:16px; }
@media (min-width:640px){ .product-grid{ grid-template-columns: repeat(3,1fr); gap:20px; } }
@media (min-width:1080px){ .product-grid{ grid-template-columns: repeat(4,1fr); } }
.rail{ display:flex; gap:18px; overflow-x:auto; padding: 4px 2px 18px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling:touch; }
.rail::-webkit-scrollbar{ display:none; }
.rail .product-card{ flex: 0 0 210px; scroll-snap-align:start; }
@media (min-width:640px){ .rail .product-card{ flex-basis: 240px; } }

.product-card{
  background: var(--white); border-radius: var(--r-lg); overflow:hidden; box-shadow: var(--shadow-sm);
  transition: transform var(--med) var(--ease), box-shadow var(--med) var(--ease); position:relative; display:flex; flex-direction:column;
}
.product-card:hover{ transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.pc-media{ position:relative; aspect-ratio: 4/3; overflow:hidden; background: var(--cream-deep); }
.pc-media img{ width:100%; height:100%; object-fit:cover; transition: transform var(--slow) var(--ease); }
.product-card:hover .pc-media img{ transform: scale(1.08); }
.veg-tag{
  position:absolute; top:10px; left:10px; width:20px; height:20px; border:2px solid var(--sage); border-radius:4px; background:var(--white);
  display:flex; align-items:center; justify-content:center;
}
.veg-tag::after{ content:''; width:9px; height:9px; border-radius:50%; background: var(--sage); }
.veg-tag.nonveg{ border-color: var(--maroon); }
.veg-tag.nonveg::after{ background: var(--maroon); border-radius: 0; clip-path: polygon(50% 0,100% 100%,0 100%); width:11px; height:11px; }
.pc-badge{ position:absolute; top:10px; right:10px; background: var(--marigold); color:#fff; font-size:10.5px; font-weight:800; padding:4px 9px; border-radius: var(--r-pill); letter-spacing:.02em; }
.pc-badge.sale{ background: var(--maroon); }
.wish-btn{
  position:absolute; bottom:10px; right:10px; width:34px; height:34px; border-radius:50%; background: rgba(255,255,255,.92); border:none;
  display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-sm); transition: transform var(--fast) var(--ease);
}
.wish-btn:hover{ transform: scale(1.1); }
.wish-btn svg{ transition: fill var(--fast), stroke var(--fast); }
.wish-btn.active svg{ fill: var(--maroon); stroke: var(--maroon); }
.wish-btn.pop svg{ animation: heartpop .38s var(--ease); }
@keyframes heartpop{ 0%{transform:scale(1)} 45%{transform:scale(1.4)} 100%{transform:scale(1)} }

.pc-body{ padding:14px 14px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
.pc-title{ font-family: var(--font-display); font-weight:600; font-size:15.5px; line-height:1.25; }
.pc-desc{ font-size:12px; color: var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pc-rating{ display:flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color: var(--ink-soft); }
.pc-rating .star{ color: var(--marigold-deep); }
.pc-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px; }
.pc-price{ display:flex; align-items:baseline; gap:6px; }
.pc-price b{ font-family: var(--font-display); font-size:17px; }
.pc-price del{ font-size:12px; color: var(--ink-faint); }

.add-btn{
  background: var(--marigold-tint); color: var(--marigold-deep); border: 1.5px solid var(--marigold); font-weight:800; font-size:13px;
  padding: 7px 16px; border-radius: var(--r-pill); transition: all var(--fast) var(--ease);
}
.add-btn:hover{ background: var(--marigold); color:#fff; }
.qty-stepper{
  display:flex; align-items:center; gap:0; background: var(--marigold); border-radius: var(--r-pill); overflow:hidden; height:32px;
  animation: fadeIn var(--fast);
}
.qty-stepper button{ width:30px; height:32px; background:transparent; border:none; color:#fff; font-weight:800; font-size:16px; }
.qty-stepper button:hover{ background: rgba(255,255,255,.18); }
.qty-stepper .qty-val{ color:#fff; font-weight:800; font-size:13.5px; min-width:20px; text-align:center; }

/* Offer cards */
.offer-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:16px; }
@media (min-width:720px){ .offer-grid{ grid-template-columns: repeat(4,1fr); } }
.offer-card{
  border-radius: var(--r-lg); padding:22px 18px; position:relative; overflow:hidden; color:#fff; min-height:150px; display:flex; flex-direction:column; justify-content:flex-end;
  box-shadow: var(--shadow-sm); transition: transform var(--fast) var(--ease);
}
.offer-card:hover{ transform: translateY(-5px); }
.offer-card h4{ color:#fff; font-size:17px; margin-bottom:4px; }
.offer-card p{ font-size:12px; opacity:.9; }
.offer-card .badge{ position:absolute; top:14px; left:14px; background: rgba(255,255,255,.2); font-size:10.5px; font-weight:800; padding:4px 10px; border-radius: var(--r-pill); }
.offer-1{ background: linear-gradient(140deg,#E2900C,#B96F00); }
.offer-2{ background: linear-gradient(140deg,#9A3324,#6E241A); }
.offer-3{ background: linear-gradient(140deg,#4B7A52,#33552F); }
.offer-4{ background: linear-gradient(140deg,#2A2016,#453626); }

/* Why us */
.why-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:16px; }
@media (min-width:720px){ .why-grid{ grid-template-columns: repeat(3,1fr); } }
.why-card{ background: var(--white); border-radius: var(--r-lg); padding:22px; box-shadow: var(--shadow-sm); transition: transform var(--fast) var(--ease); }
.why-card:hover{ transform: translateY(-4px); }
.why-icon{ width:46px; height:46px; border-radius:14px; background: var(--marigold-tint); color: var(--marigold-deep); display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
.why-card h4{ font-size:15.5px; margin-bottom:4px; }
.why-card p{ font-size:13px; color: var(--ink-soft); }

/* Reviews */
.review-rail{ display:flex; gap:18px; overflow-x:auto; padding: 4px 2px 18px; }
.review-rail::-webkit-scrollbar{ display:none; }
.review-card{ flex:0 0 300px; background: var(--white); border-radius: var(--r-lg); padding:20px; box-shadow: var(--shadow-sm); }
.review-top{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.avatar{ width:40px; height:40px; border-radius:50%; background: var(--maroon-tint); color: var(--maroon-deep); display:flex; align-items:center; justify-content:center; font-weight:800; font-family: var(--font-display); }
.review-card .stars{ color: var(--marigold-deep); font-size:13px; margin-bottom:8px; }
.review-card p{ font-size:13.5px; color: var(--ink-soft); }
.review-card .rdate{ display:block; margin-top:10px; font-size:11.5px; color: var(--ink-faint); }

/* Instagram gallery */
.insta-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; }
@media (min-width:720px){ .insta-grid{ grid-template-columns: repeat(6,1fr); } }
.insta-tile{ aspect-ratio:1/1; border-radius: var(--r-md); overflow:hidden; position:relative; }
.insta-tile img{ width:100%; height:100%; object-fit:cover; transition: transform var(--med) var(--ease); }
.insta-tile:hover img{ transform: scale(1.12); }

/* ============ FOOTER ============ */
.site-footer{ background: var(--ink); color: var(--cream); padding: 56px 0 26px; margin-top: 40px; }
.footer-grid{ display:grid; gap:36px; grid-template-columns: 1.3fr repeat(3,1fr); }
@media (max-width: 860px){ .footer-grid{ grid-template-columns: 1fr 1fr; } }
.site-footer h5{ font-size:13px; text-transform:uppercase; letter-spacing:.08em; color: var(--marigold); margin-bottom:16px; font-family: var(--font-body); font-weight:800; }
.site-footer a{ display:block; padding:5px 0; font-size:14px; color: rgba(251,243,230,.72); }
.site-footer a:hover{ color: var(--cream); }
.footer-brand p{ color: rgba(251,243,230,.65); font-size:13.5px; margin-top:10px; max-width:280px; }
.footer-social{ display:flex; gap:10px; margin-top:16px; }
.footer-social a{ width:38px; height:38px; border-radius:50%; background: rgba(251,243,230,.08); display:flex; align-items:center; justify-content:center; padding:0; }
.footer-bottom{ border-top:1px solid rgba(251,243,230,.14); margin-top:36px; padding-top:20px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; font-size:12.5px; color: rgba(251,243,230,.55); }

/* ============ TOASTS ============ */
.toast-stack{ position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:1000; display:flex; flex-direction:column; gap:10px; width:min(360px,92vw); }
.toast{
  background: var(--ink); color: var(--cream); padding:13px 18px; border-radius: var(--r-md); box-shadow: var(--shadow-lg);
  font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:10px;
  animation: toastIn .32s var(--ease);
}
.toast.success{ background: #2F5D34; }
.toast.error{ background: var(--maroon-deep); }
@keyframes toastIn{ from{ opacity:0; transform: translateY(-14px) scale(.96);} to{ opacity:1; transform: translateY(0) scale(1);} }
.toast.leaving{ animation: toastOut .25s var(--ease) forwards; }
@keyframes toastOut{ to{ opacity:0; transform: translateY(-10px) scale(.96);} }

/* ============ SKELETONS ============ */
.skel{ background: linear-gradient(100deg, var(--cream-deep) 30%, #fff 50%, var(--cream-deep) 70%); background-size:200% 100%; animation: shimmer 1.3s infinite; border-radius: var(--r-md); }
@keyframes shimmer{ from{ background-position: 150% 0;} to{ background-position: -50% 0;} }
.skel-card{ height: 250px; border-radius: var(--r-lg); }

/* ============ EMPTY STATES ============ */
.empty-state{ text-align:center; padding: 70px 20px; }
.empty-icon{ width:84px; height:84px; border-radius:50%; background: var(--marigold-tint); display:flex; align-items:center; justify-content:center; font-size:36px; margin:0 auto 20px; }
.empty-state h3{ margin-bottom:8px; }
.empty-state p{ color: var(--ink-soft); max-width:340px; margin: 0 auto 22px; font-size:14.5px; }

/* ============ FORMS ============ */
.field{ margin-bottom:18px; }
.field label{ display:block; font-size:13px; font-weight:700; margin-bottom:7px; color: var(--ink-soft); }
.field input, .field select, .field textarea{
  width:100%; padding:13px 15px; border-radius: var(--r-md); border:1.5px solid var(--line-strong); background: var(--white);
  font-size:14.5px; color: var(--ink); transition: border-color var(--fast); outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--marigold); }
.field-hint{ font-size:11.5px; color: var(--ink-faint); margin-top:5px; }
.field-error{ font-size:11.5px; color: var(--maroon-deep); margin-top:5px; display:none; font-weight:600; }
.field.invalid input{ border-color: var(--maroon); }
.field.invalid .field-error{ display:block; }
.checkbox-row{ display:flex; align-items:center; gap:9px; font-size:13.5px; }
.chip-select{ display:flex; gap:10px; flex-wrap:wrap; }
.chip-option{ padding:9px 16px; border-radius: var(--r-pill); border:1.5px solid var(--line-strong); font-size:13.5px; font-weight:700; background:var(--white); }
.chip-option.active{ border-color: var(--marigold); background: var(--marigold-tint); color: var(--marigold-deep); }

/* ============ MISC UTIL ============ */
.flex{ display:flex; } .items-center{ align-items:center; } .justify-between{ justify-content:space-between; }
.gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;}
.mt-8{margin-top:8px;} .mt-16{margin-top:16px;} .mt-24{margin-top:24px;} .mt-40{margin-top:40px;}
.mb-16{margin-bottom:16px;} .mb-24{margin-bottom:24px;}
.card{ background: var(--white); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
.divider{ height:1px; background: var(--line); border:none; margin: 20px 0; }
.badge-pill{ background: var(--sage-tint); color:#2F5D34; font-size:11.5px; font-weight:800; padding:4px 10px; border-radius: var(--r-pill); display:inline-flex; align-items:center; gap:5px; }
.page-hero{ padding: 40px 0 30px; text-align:center; }
.breadcrumbs{ font-size:12.5px; color: var(--ink-faint); display:flex; gap:6px; align-items:center; margin-bottom:14px; }
.breadcrumbs a{ font-weight:700; color: var(--ink-soft); }
.rating-star-input{ display:flex; gap:4px; font-size:22px; color: var(--line-strong); cursor:pointer; }
.rating-star-input .on{ color: var(--marigold-deep); }

/* ============ POLISH: stagger entrance for grids ============ */
.stagger-in{ opacity:0; transform: translateY(16px) scale(.98); }
.stagger-in.show{ opacity:1; transform: translateY(0) scale(1); transition: opacity .5s var(--ease), transform .5s var(--ease); }

/* ============ POLISH: ripple feedback on buttons ============ */
.btn, .add-btn, .icon-btn, .fab{ position:relative; overflow:hidden; }
.ripple{
  position:absolute; border-radius:50%; background: rgba(255,255,255,.55); pointer-events:none;
  transform: scale(0); animation: rippleAnim .55s ease-out forwards;
}
.btn-outline .ripple, .btn-ghost .ripple, .icon-btn .ripple, .add-btn .ripple{ background: rgba(226,144,12,.28); }
@keyframes rippleAnim{ to{ transform: scale(2.6); opacity:0; } }

/* ============ POLISH: hero tilt ============ */
.hero-plate{ transition: transform .25s var(--ease), box-shadow var(--fast); will-change: transform; }

/* ============ POLISH: animated counters ============ */
.hero-stat b{ font-variant-numeric: tabular-nums; }

/* ============ POLISH: spice flame indicator ============ */
.spice-flames{ display:inline-flex; gap:2px; letter-spacing:-2px; font-size:13px; }
.spice-flames .off{ opacity:.22; filter:grayscale(1); }

/* ============ POLISH: page fade-in (CSS-only, no JS dependency) ============ */
body{ animation: pageFadeIn .4s ease both; }
@keyframes pageFadeIn{ from{ opacity:0; } to{ opacity:1; } }

/* ============ POLISH: image shimmer-in ============ */
.pc-media img, .pd-gallery-main img{ background: var(--cream-deep); }

/* ============ POLISH: marquee for instagram/reviews on small screens handled by existing overflow rails ============ */
@media (hover:hover){
  .cat-ring{ transition: transform var(--fast) var(--ease), border-color var(--fast), box-shadow var(--fast); }
  .cat-card:hover .cat-ring{ transform: translateY(-2px) scale(1.06); }
}
/* ============ MENU PAGE ============ */
.menu-toolbar{ position: sticky; top: var(--header-h); z-index:200; background: rgba(251,243,230,.92); backdrop-filter: blur(10px); padding: 16px 0; border-bottom:1px solid var(--line); }
@media (max-width:719px){ .menu-toolbar{ top: var(--header-h-mobile); } }
.menu-search{ display:flex; align-items:center; gap:10px; background: var(--white); border-radius: var(--r-pill); padding:12px 18px; box-shadow: var(--shadow-sm); margin-bottom:14px; }
.menu-search input{ border:none; outline:none; flex:1; font-size:14.5px; background:transparent; }
.chip-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
.chip-row::-webkit-scrollbar{ display:none; }
.filter-chip{ flex-shrink:0; padding:9px 18px; border-radius: var(--r-pill); background: var(--white); font-weight:700; font-size:13.5px; color: var(--ink-soft); box-shadow: var(--shadow-sm); border: 1.5px solid transparent; transition: all var(--fast); }
.filter-chip.active{ background: var(--maroon); color:#fff; }
.toolbar-row2{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; flex-wrap:wrap; }
.select-mini{ padding:9px 14px; border-radius: var(--r-pill); border:1.5px solid var(--line-strong); background:var(--white); font-size:13px; font-weight:700; }
.filter-toggle-btn{ display:flex; align-items:center; gap:7px; padding:9px 16px; border-radius:var(--r-pill); background:var(--white); border:1.5px solid var(--line-strong); font-weight:700; font-size:13px; }
.result-count{ font-size:13px; color: var(--ink-soft); font-weight:600; }

.menu-layout{ display:grid; grid-template-columns: 1fr; gap:28px; margin-top:24px; }
@media (min-width:980px){ .menu-layout{ grid-template-columns: 240px 1fr; } }
.filter-sidebar{ display:none; }
@media (min-width:980px){ .filter-sidebar{ display:block; } }
.filter-group{ margin-bottom:24px; }
.filter-group h5{ font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color: var(--ink-soft); margin-bottom:12px; }
.filter-option{ display:flex; align-items:center; gap:9px; padding:6px 0; font-size:13.5px; }
.price-slider{ width:100%; }

.filter-drawer-sheet{ padding: 6px 0; }
.category-strip-title{ margin: 46px 0 18px; }

/* ============ PRODUCT DETAIL PAGE ============ */
.pd-wrap{ display:grid; gap:40px; grid-template-columns: 1fr; }
@media (min-width:960px){ .pd-wrap{ grid-template-columns: 1fr 1fr; gap:56px; } }
.pd-gallery-main{ position:relative; aspect-ratio:1/1; border-radius: var(--r-xl); overflow:hidden; background: var(--cream-deep); box-shadow: var(--shadow-md); }
.pd-gallery-main img{ width:100%; height:100%; object-fit:cover; }
.pd-zoom-btn{ position:absolute; bottom:14px; right:14px; background: rgba(255,255,255,.92); }
.pd-thumbs{ display:flex; gap:10px; margin-top:12px; }
.pd-thumb{ width:66px; height:66px; border-radius: var(--r-sm); overflow:hidden; border:2px solid transparent; opacity:.7; }
.pd-thumb.active{ border-color: var(--marigold); opacity:1; }
.pd-thumb img{ width:100%; height:100%; object-fit:cover; }
.pd-carousel{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; border-radius: var(--r-xl); }
.pd-carousel img{ min-width:100%; aspect-ratio:1/1; object-fit:cover; scroll-snap-align:start; }

.pd-top-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
.pd-title{ margin:10px 0 6px; }
.pd-rating-row{ display:flex; align-items:center; gap:10px; font-size:13.5px; color: var(--ink-soft); margin-bottom:14px; }
.pd-rating-row .stars{ color: var(--marigold-deep); font-weight:800; }
.pd-price-row{ display:flex; align-items:baseline; gap:10px; margin-bottom:16px; }
.pd-price-row b{ font-family: var(--font-display); font-size:30px; }
.pd-price-row del{ color: var(--ink-faint); font-size:16px; }
.pd-meta-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
.meta-pill{ display:flex; align-items:center; gap:6px; background: var(--white); box-shadow: var(--shadow-sm); border-radius: var(--r-pill); padding:7px 13px; font-size:12px; font-weight:700; color: var(--ink-soft); }
.pd-desc{ font-size:14.5px; color: var(--ink-soft); line-height:1.7; margin-bottom:22px; }

.pd-option-block{ margin-bottom:22px; }
.pd-option-block h5{ font-size:14px; margin-bottom:12px; }
.addon-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background: var(--white); border-radius: var(--r-md); box-shadow: var(--shadow-sm); margin-bottom:9px; }
.addon-row label{ display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:600; }
.addon-row .price{ font-size:13px; font-weight:700; color: var(--marigold-deep); }

.pd-qty-row{ display:flex; align-items:center; gap:16px; margin-bottom:20px; }
.pd-qty-row .qty-stepper{ height:44px; }
.pd-qty-row .qty-stepper button{ width:40px; height:44px; font-size:18px; }
.pd-sticky-cta{ display:flex; gap:12px; align-items:center; }
.pd-sticky-cta .btn{ flex:1; }

.pd-tabs{ display:flex; gap:6px; border-bottom:1.5px solid var(--line); margin: 44px 0 22px; overflow-x:auto; }
.pd-tab{ padding:12px 18px; font-weight:700; font-size:13.5px; color: var(--ink-faint); border-bottom:2.5px solid transparent; white-space:nowrap; }
.pd-tab.active{ color: var(--maroon-deep); border-color: var(--maroon-deep); }
.pd-tab-panel{ display:none; }
.pd-tab-panel.active{ display:block; animation: fadeIn var(--fast); }
.ingredient-tags{ display:flex; gap:8px; flex-wrap:wrap; }
.ingredient-tags span{ background: var(--cream-deep); padding:6px 13px; border-radius: var(--r-pill); font-size:12.5px; font-weight:600; }
.review-item{ padding:18px 0; border-bottom:1px solid var(--line); }
.review-item .review-top{ margin-bottom:6px; }
.verified-badge{ font-size:10.5px; font-weight:800; color:#2F5D34; background: var(--sage-tint); padding:2px 8px; border-radius: var(--r-pill); margin-left:6px; }

/* Mobile sticky add-to-cart bar for product page */
.pd-mobile-bar{ position:fixed; left:0; right:0; bottom:0; background: var(--paper); padding:12px 16px; box-shadow: 0 -8px 24px rgba(0,0,0,.08); display:flex; gap:12px; z-index: 460; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
@media (min-width:720px){ .pd-mobile-bar{ display:none; } }

/* ============ CART PAGE ============ */
.cart-layout{ display:grid; gap:28px; grid-template-columns: 1fr; }
@media (min-width:920px){ .cart-layout{ grid-template-columns: 1.6fr 1fr; align-items:flex-start; } }
.cart-item{ display:flex; gap:14px; background: var(--white); border-radius: var(--r-lg); padding:14px; box-shadow: var(--shadow-sm); margin-bottom:14px; }
.cart-item img{ width:88px; height:88px; border-radius: var(--r-md); object-fit:cover; flex-shrink:0; }
.ci-info{ flex:1; min-width:0; }
.ci-info h4{ font-size:15px; margin-bottom:3px; }
.ci-opts{ font-size:12px; color: var(--ink-faint); margin-bottom:8px; }
.ci-foot{ display:flex; align-items:center; justify-content:space-between; }
.ci-remove{ font-size:12px; font-weight:700; color: var(--maroon-deep); }
.free-delivery-bar{ background: var(--white); border-radius: var(--r-lg); padding:16px 18px; box-shadow: var(--shadow-sm); margin-bottom:18px; }
.progress-track{ height:8px; background: var(--cream-deep); border-radius: var(--r-pill); overflow:hidden; margin-top:10px; }
.progress-fill{ height:100%; background: linear-gradient(90deg, var(--marigold), var(--maroon)); border-radius: var(--r-pill); transition: width var(--med) var(--ease); }
.order-summary{ background: var(--white); border-radius: var(--r-lg); padding:22px; box-shadow: var(--shadow-sm); position:sticky; top: calc(var(--header-h) + 20px); }
.summary-row{ display:flex; justify-content:space-between; font-size:13.5px; color: var(--ink-soft); padding:7px 0; }
.summary-row.total{ font-size:17px; font-weight:800; color: var(--ink); border-top:1px solid var(--line); margin-top:8px; padding-top:14px; }
.coupon-box{ display:flex; gap:8px; margin: 16px 0; }
.coupon-box input{ flex:1; padding:11px 14px; border-radius: var(--r-md); border:1.5px solid var(--line-strong); font-size:13.5px; }
.coupon-msg{ font-size:12.5px; font-weight:700; margin-top:8px; }
.coupon-msg.ok{ color:#2F5D34; }
.coupon-msg.bad{ color: var(--maroon-deep); }

/* ============ CHECKOUT ============ */
.checkout-steps{ display:flex; align-items:center; gap:6px; margin-bottom: 32px; justify-content:center; flex-wrap:wrap; }
.cstep{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color: var(--ink-faint); }
.cstep .num{ width:26px; height:26px; border-radius:50%; background: var(--cream-deep); display:flex; align-items:center; justify-content:center; font-size:12px; }
.cstep.active{ color: var(--maroon-deep); } .cstep.active .num{ background: var(--maroon); color:#fff; }
.cstep.done .num{ background: #2F5D34; color:#fff; }
.cstep-line{ width:30px; height:2px; background: var(--line-strong); }
.address-card{ background: var(--white); border-radius: var(--r-lg); padding:16px; box-shadow: var(--shadow-sm); margin-bottom:12px; display:flex; gap:12px; align-items:flex-start; border:2px solid transparent; }
.address-card.selected{ border-color: var(--marigold); }

.tl-item.done::after{ background: #2F5D34; }

<script>
/* ============================================================
   KAUR'S KITCHEN — FIRESTORE CATALOG SYNC
   Keeps KK.products / KK.categories / KK.coupons / KK.offers /
   KK.config live-updated from Firestore. The static arrays
   defined in this file (data.js) act as the *seed* data — what
   a fresh Firebase project gets populated with via the admin
   portal's "Seed Database" button. Once Firestore has data,
   these listeners take over.
   ============================================================ */

/* Keep a frozen copy of the built-in seed data before Firestore
   listeners start overwriting KK.* — used by the admin portal's
   "Seed Database" and "Reset a Section" actions. */
const KK_SEED = {
  products: JSON.parse(JSON.stringify(KK.products)),
  categories: JSON.parse(JSON.stringify(KK.categories)),
  coupons: JSON.parse(JSON.stringify(KK.coupons)),
  offers: JSON.parse(JSON.stringify(KK.offers)),
  config: JSON.parse(JSON.stringify(KK.config)),
};

const KKSync = (() => {
  let onChange = () => {};
  let unsubs = [];
  const ready = { products:false, categories:false, coupons:false, offers:false, config:false };

  function setOnChange(fn){ onChange = fn; }
  function isReady(){ return Object.values(ready).every(Boolean); }

  function start(){
    unsubs.push(db.collection("products").onSnapshot(snap => {
      if(!snap.empty){ KK.products = snap.docs.map(d => d.data()); }
      ready.products = true;
      onChange();
    }, err => { console.error("products sync error:", err); ready.products = true; onChange(); }));

    unsubs.push(db.collection("categories").onSnapshot(snap => {
      if(!snap.empty){ KK.categories = snap.docs.map(d => d.data()); }
      ready.categories = true;
      onChange();
    }, err => { console.error("categories sync error:", err); ready.categories = true; onChange(); }));

    unsubs.push(db.collection("coupons").onSnapshot(snap => {
      if(!snap.empty){
        const obj = {};
        snap.docs.forEach(d => obj[d.id] = d.data());
        KK.coupons = obj;
      }
      ready.coupons = true;
      onChange();
    }, err => { console.error("coupons sync error:", err); ready.coupons = true; onChange(); }));

    unsubs.push(db.collection("offers").onSnapshot(snap => {
      if(!snap.empty){ KK.offers = snap.docs.map(d => d.data()); }
      ready.offers = true;
      onChange();
    }, err => { console.error("offers sync error:", err); ready.offers = true; onChange(); }));

    unsubs.push(db.collection("settings").doc("site").onSnapshot(doc => {
      if(doc.exists){ KK.config = Object.assign({}, KK.config, doc.data()); }
      ready.config = true;
      onChange();
    }, err => { console.error("settings sync error:", err); ready.config = true; onChange(); }));
  }

  function stop(){ unsubs.forEach(u=>u()); unsubs = []; }

  /* ---- Admin write helpers (used by admin.html) ---- */
  function saveProduct(product){ return db.collection("products").doc(product.slug).set(product); }
  function deleteProduct(slug){ return db.collection("products").doc(slug).delete(); }
  function saveCategory(cat){ return db.collection("categories").doc(cat.id).set(cat); }
  function deleteCategory(id){ return db.collection("categories").doc(id).delete(); }
  function saveCoupon(code, data){ return db.collection("coupons").doc(code).set(data); }
  function deleteCoupon(code){ return db.collection("coupons").doc(code).delete(); }
  function saveOffer(offer){ return db.collection("offers").doc(offer.id).set(offer); }
  function deleteOffer(id){ return db.collection("offers").doc(id).delete(); }
  function saveConfig(config){ return db.collection("settings").doc("site").set(config, { merge:true }); }

  /* ---- Seed / reset: writes the built-in defaults into Firestore ---- */
  function seedAll(){
    const batch = db.batch();
    KK_SEED.products.forEach(p => batch.set(db.collection("products").doc(p.slug), p));
    KK_SEED.categories.forEach(c => batch.set(db.collection("categories").doc(c.id), c));
    Object.entries(KK_SEED.coupons).forEach(([code,c]) => batch.set(db.collection("coupons").doc(code), c));
    KK_SEED.offers.forEach(o => batch.set(db.collection("offers").doc(o.id), o));
    batch.set(db.collection("settings").doc("site"), KK_SEED.config);
    return batch.commit();
  }

  function resetSection(section){
    const collMap = { products:"products", categories:"categories", coupons:"coupons", offers:"offers" };
    if(section === "config"){ return db.collection("settings").doc("site").set(KK_SEED.config); }
    const collName = collMap[section];
    return db.collection(collName).get().then(snap => {
      const batch = db.batch();
      snap.docs.forEach(d => batch.delete(d.ref));
      if(section === "products") KK_SEED.products.forEach(p => batch.set(db.collection("products").doc(p.slug), p));
      if(section === "categories") KK_SEED.categories.forEach(c => batch.set(db.collection("categories").doc(c.id), c));
      if(section === "coupons") Object.entries(KK_SEED.coupons).forEach(([code,c]) => batch.set(db.collection("coupons").doc(code), c));
      if(section === "offers") KK_SEED.offers.forEach(o => batch.set(db.collection("offers").doc(o.id), o));
      return batch.commit();
    });
  }

  return {
    start, stop, isReady, setOnChange,
    saveProduct, deleteProduct, saveCategory, deleteCategory,
    saveCoupon, deleteCoupon, saveOffer, deleteOffer, saveConfig,
    seedAll, resetSection
  };
})();

</script>

<script>
/* ============================================================
   KAUR'S KITCHEN — FIREBASE-BACKED STORE
   Cart stays in localStorage (per-device, ephemeral — standard
   e-commerce practice). Everything that needs to sync across
   devices — catalog data, orders, wishlist, addresses, auth —
   is backed by Firebase (Auth + Firestore).
   Requires firebase-init.js to have run first (defines `auth`
   and `db`).
   ============================================================ */

const KKStore = (() => {
  const KEYS = { cart:"kk_cart", coupon:"kk_coupon" };

  function read(key, fallback){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  }
  function write(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  /* ---------------- CART (localStorage — unchanged) ---------------- */
  function getCart(){ return read(KEYS.cart, []); }
  function saveCart(cart){ write(KEYS.cart, cart); document.dispatchEvent(new CustomEvent("kk:cartchange", { detail: cart })); }
  function lineKey(productId, variant, addonIds){
    return productId + "|" + (variant||"") + "|" + (addonIds||[]).slice().sort().join(",");
  }
  function addToCart(product, opts={}){
    const cart = getCart();
    const variant = opts.variant || "";
    const addonIds = opts.addonIds || [];
    const qty = opts.qty || 1;
    const key = lineKey(product.id, variant, addonIds);
    const existing = cart.find(l => l.key === key);
    if(existing){ existing.qty += qty; }
    else{
      const addonsFull = (product.addons||[]).filter(a => addonIds.includes(a.id));
      cart.push({
        key, productId: product.id, name: product.name, slug: product.slug, image: product.images[0],
        price: product.discountPrice || product.price, variant, addons: addonsFull, qty
      });
    }
    saveCart(cart);
    return cart;
  }
  function updateQty(key, qty){
    let cart = getCart();
    if(qty <= 0){ cart = cart.filter(l => l.key !== key); }
    else{ const l = cart.find(x=>x.key===key); if(l) l.qty = qty; }
    saveCart(cart);
  }
  function removeFromCart(key){ saveCart(getCart().filter(l => l.key !== key)); }
  function clearCart(){ saveCart([]); write(KEYS.coupon, null); }
  function cartCount(){ return getCart().reduce((s,l)=>s+l.qty,0); }
  function lineTotal(line){ return (line.price + line.addons.reduce((s,a)=>s+a.price,0)) * line.qty; }
  function cartSubtotal(){ return getCart().reduce((s,l)=>s+lineTotal(l),0); }

  /* ---------------- COUPON (localStorage — just remembers the typed code; validity checked live against Firestore-backed KK.coupons) ---------------- */
  function getCoupon(){ return read(KEYS.coupon, null); }
  function setCoupon(code){ write(KEYS.coupon, code); document.dispatchEvent(new CustomEvent("kk:cartchange")); }
  function couponDiscount(subtotal){
    const code = getCoupon();
    if(!code || !KK.coupons[code]) return 0;
    const c = KK.coupons[code];
    if(subtotal < c.minOrder) return 0;
    if(c.type === "flat") return Math.min(c.value, subtotal);
    const pct = Math.round(subtotal * (c.value/100));
    return c.maxDiscount ? Math.min(pct, c.maxDiscount) : pct;
  }

  /* ---------------- AUTH (Firebase Auth) ---------------- */
  let currentUser = null;      // { uid, email, name } or null
  let authReady = false;
  const authReadyWaiters = [];

  auth.onAuthStateChanged(user => {
    currentUser = user ? { uid:user.uid, email:user.email, name:user.displayName || user.email.split("@")[0] } : null;
    authReady = true;
    authReadyWaiters.splice(0).forEach(fn=>fn());
    if(user) startUserDataListeners(user.uid); else stopUserDataListeners();
    document.dispatchEvent(new CustomEvent("kk:authchange", { detail: currentUser }));
  });

  function onAuthReady(fn){ if(authReady) fn(); else authReadyWaiters.push(fn); }
  function getUser(){ return currentUser; }
  function isLoggedIn(){ return !!currentUser; }

  function login(email, password){ return auth.signInWithEmailAndPassword(email, password); }
  function signup(email, password, name){
    return auth.createUserWithEmailAndPassword(email, password).then(cred => {
      return cred.user.updateProfile({ displayName: name }).then(() => {
        currentUser = { uid: cred.user.uid, email, name };
        return cred.user.sendEmailVerification().catch(()=>{});
      }).then(() => cred);
    });
  }
  function logout(){ return auth.signOut(); }
  function sendPasswordReset(email){ return auth.sendPasswordResetEmail(email); }

  /* ---------------- PER-USER DATA (wishlist, addresses — Firestore, live-synced) ---------------- */
  let wishlist = [];
  let addresses = [];
  let userDocUnsub = null;

  function startUserDataListeners(uid){
    stopUserDataListeners();
    userDocUnsub = db.collection("users").doc(uid).onSnapshot(doc => {
      const data = doc.exists ? doc.data() : {};
      wishlist = data.wishlist || [];
      addresses = data.addresses || [];
      document.dispatchEvent(new CustomEvent("kk:wishlistchange", { detail: wishlist }));
      document.dispatchEvent(new CustomEvent("kk:addresseschange", { detail: addresses }));
    }, err => console.error("User data listener error:", err));
  }
  function stopUserDataListeners(){
    if(userDocUnsub){ userDocUnsub(); userDocUnsub = null; }
    wishlist = []; addresses = [];
  }

  function getWishlist(){ return wishlist; }
  function isWishlisted(slug){ return wishlist.includes(slug); }
  function toggleWishlist(slug){
    if(!currentUser){ document.dispatchEvent(new CustomEvent("kk:needlogin", { detail:{ reason:"wishlist" } })); return Promise.resolve(false); }
    const userRef = db.collection("users").doc(currentUser.uid);
    const active = !wishlist.includes(slug);
    const update = active
      ? { wishlist: firebase.firestore.FieldValue.arrayUnion(slug) }
      : { wishlist: firebase.firestore.FieldValue.arrayRemove(slug) };
    return userRef.set(update, { merge:true }).then(()=>active);
  }

  function getAddresses(){ return addresses; }
  function saveAddress(addr){
    if(!currentUser) return Promise.reject(new Error("Not logged in"));
    const userRef = db.collection("users").doc(currentUser.uid);
    const list = addresses.slice();
    if(addr.id){ const i = list.findIndex(a=>a.id===addr.id); if(i>-1){ list[i]=addr; } else list.push(addr); }
    else{ addr.id = "addr_" + Date.now(); list.push(addr); }
    return userRef.set({ addresses: list }, { merge:true }).then(()=>list);
  }
  function deleteAddress(id){
    if(!currentUser) return Promise.reject(new Error("Not logged in"));
    const userRef = db.collection("users").doc(currentUser.uid);
    return userRef.set({ addresses: addresses.filter(a=>a.id!==id) }, { merge:true });
  }

  /* ---------------- RECENTLY VIEWED (localStorage — device-local is fine) ---------------- */
  function addRecent(slug){
    let r = read("kk_recent", []);
    r = r.filter(x=>x!==slug);
    r.unshift(slug);
    r = r.slice(0,12);
    write("kk_recent", r);
  }
  function getRecent(){ return read("kk_recent", []); }

  /* ---------------- ORDERS (Firestore, live-synced for the current user) ---------------- */
  let myOrders = [];
  let ordersUnsub = null;

  function startOrdersListener(uid){
    if(ordersUnsub) ordersUnsub();
    ordersUnsub = db.collection("orders").where("userId","==",uid)
      .onSnapshot(snap => {
        myOrders = snap.docs.map(d => Object.assign({ id:d.id }, d.data()))
          .sort((a,b)=> (b.date||"").localeCompare(a.date||""));
        document.dispatchEvent(new CustomEvent("kk:orderschange", { detail: myOrders }));
      }, err => console.error("Orders listener error:", err));
  }
  document.addEventListener("kk:authchange", e => {
    if(e.detail){ startOrdersListener(e.detail.uid); }
    else { if(ordersUnsub){ ordersUnsub(); ordersUnsub = null; } myOrders = []; }
  });

  function getOrders(){ return myOrders; }
  function placeOrder(order){
    if(!currentUser) return Promise.reject(new Error("Not logged in"));
    const payload = Object.assign({}, order, {
      userId: currentUser.uid,
      userEmail: currentUser.email,
      date: new Date().toISOString(),
      status: "Order Placed"
    });
    return db.collection("orders").add(payload).then(ref => Object.assign({ id: ref.id }, payload));
  }
  function updateOrderStatus(orderId, status){
    return db.collection("orders").doc(orderId).update({ status });
  }

  return {
    getCart, addToCart, updateQty, removeFromCart, clearCart, cartCount, lineTotal, cartSubtotal,
    getCoupon, setCoupon, couponDiscount,
    getWishlist, isWishlisted, toggleWishlist,
    getAddresses, saveAddress, deleteAddress,
    addRecent, getRecent,
    getUser, login, signup, logout, isLoggedIn, sendPasswordReset, onAuthReady,
    getOrders, placeOrder, updateOrderStatus
  };
})();

</script>

            <a href="tel:${CFG.phone.replace(/\s/g,'')}">${CFG.phone}</a>
            <a href="https://wa.me/${CFG.whatsapp}">WhatsApp Us</a>
            <a href="mailto:${CFG.email}">${CFG.email}</a>
            <a href="#/contact">${CFG.address}</a>
          </div>
        </div>
        <div class="footer-bottom">
          <span>© ${new Date().getFullYear()} Kaur's Kitchen, ${CFG.brandLocation}. All rights reserved.</span>
          <span>Made fresh, every single day.</span>
        </div>
      </div>
    </footer>`;
  }

  function floatingHTML(){
    return `
    <div class="floating-stack">
      <div style="position:relative;">
        <div class="help-popup" id="helpPopup">
          <h4>Hi! How can we help?</h4>
          <a href="https://wa.me/${CFG.whatsapp}" target="_blank" rel="noopener">💬 WhatsApp</a>
          <a href="tel:${CFG.phone.replace(/\s/g,'')}">📞 Call Us</a>
          <a href="#/contact">📍 Location</a>
          <a href="#/faq">❓ FAQs</a>
        </div>
        <button class="fab fab-help" id="helpFab" aria-label="Need help?" aria-expanded="false">
          ${ICON.help}
          <span class="fab-tooltip">Need Help?</span>
        </button>
      </div>
      <a class="fab fab-whatsapp" href="https://wa.me/${CFG.whatsapp}?text=Hi%20Kaur's%20Kitchen%2C%20I'd%20like%20to%20order" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
        ${ICON.whatsapp}
        <span class="fab-tooltip">Order / Chat with us</span>
      </a>
      <button class="floating-cart" id="floatingCart" aria-label="View cart">
        <span class="fc-icon">${ICON.cart}</span>
        <span class="fc-text"><b id="fcCount">0 items</b><span id="fcTotal">₹0</span></span>
      </button>
    </div>`;
  }

  function bottomNavHTML(){
    const items = [["home","#/","Home","home"],["menu","#/menu","Menu","grid"],["search","#/search","Search","search"],["orders","#/account?tab=orders","Orders","bag"],["account","#/account","Account","user"]];
    return `<nav class="bottom-nav" aria-label="Mobile primary" id="bottomNav">
      ${items.map(([key,href,label,icon])=>`<a href="${href}" data-bottom-route="${key}">${ICON[icon]}<span>${label}</span></a>`).join("")}
    </nav>
    <div class="mobile-cart-bar" id="mobileCartBar">
      <div><b id="mcbCount">0 items</b><span id="mcbTotal">₹0</span></div>
      <a href="#/cart" class="btn btn-primary btn-sm">View Cart</a>
    </div>`;
  }

  /* Routes that hide the mobile bottom nav (they have their own full-width sticky CTA / focused flow) */
  const NO_BOTTOM_NAV_ROUTES = new Set(["product","checkout","login","signup","forgot-password"]);

  /* ---------------- BOOT (mount shell once) ---------------- */
  function bootShell(){
    document.getElementById("app-header").innerHTML = headerHTML();
    document.getElementById("app-footer").innerHTML = footerHTML() + floatingHTML() + bottomNavHTML();
    document.body.classList.add("has-bottom-nav");
    initHeaderBehavior();
    initDrawer();
    initFloating();
    initSearchBoxes();
    initRipples();
    refreshBadges();
    document.addEventListener("kk:cartchange", refreshBadges);
    document.addEventListener("kk:wishlistchange", refreshBadges);
  }

  function initHeaderBehavior(){
    const header = document.getElementById("siteHeader");
    if(!header) return;
    const onScroll = () => header.classList.toggle("is-scrolled", window.scrollY > 12);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive:true });
  }

  function initDrawer(){
    const overlay = document.getElementById("drawerOverlay");
    const drawer = document.getElementById("mobileDrawer");
    const openBtn = document.getElementById("menuDrawerBtn");
    const closeBtn = document.getElementById("closeDrawerBtn");
    function open(){ overlay.classList.add("open"); drawer.classList.add("open"); document.body.style.overflow="hidden"; }
    function close(){ overlay.classList.remove("open"); drawer.classList.remove("open"); document.body.style.overflow=""; }
    openBtn && openBtn.addEventListener("click", open);
    closeBtn && closeBtn.addEventListener("click", close);
    overlay && overlay.addEventListener("click", close);
    document.querySelectorAll("#mobileDrawer .drawer-nav a").forEach(a=>a.addEventListener("click", close));
    document.getElementById("mobileSearchBtn") && document.getElementById("mobileSearchBtn").addEventListener("click", ()=>{ navigate("#/menu"); });
  }

  function initFloating(){
    const helpBtn = document.getElementById("helpFab");
    const helpPopup = document.getElementById("helpPopup");
    if(helpBtn){
      helpBtn.addEventListener("click", ()=>{
        const open = helpPopup.classList.toggle("open");
        helpBtn.setAttribute("aria-expanded", open);
      });
      document.addEventListener("click", (e)=>{
        if(helpPopup.classList.contains("open") && !helpPopup.contains(e.target) && e.target !== helpBtn && !helpBtn.contains(e.target)){
          helpPopup.classList.remove("open"); helpBtn.setAttribute("aria-expanded","false");
        }
      });
    }
    const floatingCart = document.getElementById("floatingCart");
    floatingCart && floatingCart.addEventListener("click", ()=>{ navigate("#/cart"); });
  }

  function initSearchBoxes(){
    [document.getElementById("headerSearchInput"), document.getElementById("drawerSearchInput")].forEach(inp=>{
      if(!inp) return;
      inp.addEventListener("keydown", e=>{
        if(e.key === "Enter" && inp.value.trim()){
          navigate("#/search?q=" + encodeURIComponent(inp.value.trim()));
        }
      });
    });
  }

  function refreshBadges(){
    const count = KKStore.cartCount();
    const subtotal = KKStore.cartSubtotal();
    setText("cartBadge", count); toggle("cartBadge", count>0);
    setText("fcCount", count + (count===1?" item":" items")); setText("fcTotal", "₹"+subtotal);
    toggleClass("floatingCart","show", count>0);
    setText("mcbCount", count + (count===1?" item":" items")); setText("mcbTotal", "₹"+subtotal);
    toggleClass("mobileCartBar","show", count>0);
    const wish = KKStore.getWishlist().length;
    setText("wishBadge", wish); toggle("wishBadge", wish>0);
  }
  function setText(id,val){ const el=document.getElementById(id); if(el) el.textContent = val; }
  function toggle(id,show){ const el=document.getElementById(id); if(el) el.style.display = show ? "flex" : "none"; }
  function toggleClass(id,cls,on){ const el=document.getElementById(id); if(el) el.classList.toggle(cls,on); }

  /* ---------------- TOASTS ---------------- */
  function toast(message, type="default"){
    const stack = document.getElementById("toastStack");
    if(!stack) return;
    const el = document.createElement("div");
    el.className = "toast " + type;
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(()=>{ el.classList.add("leaving"); setTimeout(()=>el.remove(), 260); }, 2600);
  }
  window.kkToast = toast;

  /* ---------------- SCROLL REVEAL ---------------- */
  function initReveal(){
    const items = document.querySelectorAll(".reveal:not(.in)");
    if(!("IntersectionObserver" in window) || !items.length){ items.forEach(i=>i.classList.add("in")); return; }
    const io = new IntersectionObserver(entries=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold:.14 });
    items.forEach(i=>io.observe(i));
  }

  /* ---------------- RIPPLE FEEDBACK ---------------- */
  function initRipples(){
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    document.addEventListener("click", (e)=>{
      const target = e.target.closest(".btn, .add-btn, .icon-btn, .fab");
      if(!target) return;
      const rect = target.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = (e.clientX - rect.left - size/2) + "px";
      ripple.style.top = (e.clientY - rect.top - size/2) + "px";
      target.appendChild(ripple);
      setTimeout(()=>ripple.remove(), 600);
    });
  }

  /* ---------------- ANIMATED COUNTERS ---------------- */
  function initCounters(){
    const els = document.querySelectorAll("[data-count-to]");
    if(!els.length) return;
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(!("IntersectionObserver" in window) || reduced){ els.forEach(el=>el.textContent = el.dataset.countTo + (el.dataset.countSuffix||"")); return; }
    const io = new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting) return;
        io.unobserve(entry.target);
        const el = entry.target;
        const target = parseFloat(el.dataset.countTo);
        const suffix = el.dataset.countSuffix || "";
        const isDecimal = String(target).includes(".");
        const duration = 900;
        const start = performance.now();
        function tick(now){
          const p = Math.min(1, (now-start)/duration);
          const eased = 1 - Math.pow(1-p, 3);
          const val = target * eased;
          el.textContent = (isDecimal ? val.toFixed(1) : Math.round(val)) + suffix;
          if(p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      });
    }, { threshold:.6 });
    els.forEach(el=>io.observe(el));
  }

  /* ---------------- HERO TILT ---------------- */
  function initHeroTilt(){
    const visual = document.querySelector(".hero-visual");
    const plate = document.querySelector(".hero-plate");
    if(!visual || !plate) return;
    if(window.matchMedia && (window.matchMedia("(prefers-reduced-motion: reduce)").matches || window.matchMedia("(hover: none)").matches)) return;
    visual.addEventListener("mousemove", (e)=>{
      const rect = visual.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      plate.style.transform = `rotateY(${px*10}deg) rotateX(${-py*10}deg) translateY(-4px)`;
    });
    visual.addEventListener("mouseleave", ()=>{ plate.style.transform = ""; });
  }

  /* ---------------- SPICE FLAME INDICATOR ---------------- */
  function spicyFlames(level){
    if(!level) return "";
    const map = { "Mild":1, "Medium":2, "Spicy":3, "Extra Spicy":4 };
    const count = map[level] || 1;
    let out = `<span class="spice-flames" title="${level} spice">`;
    for(let i=0;i<3;i++) out += `<span class="${i<count?'':'off'}">🌶️</span>`;
    return out + `</span>`;
  }

  /* ---------------- PRODUCT CARD (reusable component) ---------------- */
  function productCardHTML(p){
    const price = p.discountPrice || p.price;
    const wished = KKStore.isWishlisted(p.id);
    return `
    <article class="product-card" data-id="${p.id}">
      <a href="#/product/${p.slug}" class="pc-media" aria-label="${p.name}">
        <img src="${p.images[0]}" alt="${p.name}" loading="lazy">
        <span class="veg-tag ${p.veg?'':'nonveg'}" title="${p.veg?'Vegetarian':'Non-Vegetarian'}"></span>
        ${p.bestseller ? '<span class="pc-badge">Bestseller</span>' : (p.discountPrice ? '<span class="pc-badge sale">Sale</span>' : '')}
      </a>
      <button class="wish-btn ${wished?'active':''}" aria-label="Add to wishlist" data-wish="${p.id}">${ICON.heart}</button>
      <div class="pc-body">
        <a href="#/product/${p.slug}"><h3 class="pc-title">${p.name}</h3></a>
        <p class="pc-desc">${p.description}</p>
        <div class="pc-rating"><span class="star">★</span> ${p.rating} <span class="text-faint">(${p.reviewCount})</span> ${p.spicyLevel ? spicyFlames(p.spicyLevel) : ''}</div>
        <div class="pc-foot">
          <div class="pc-price"><b>₹${price}</b>${p.discountPrice?`<del>₹${p.price}</del>`:''}</div>
          <div class="pc-cta" data-cta="${p.id}">
            ${cartQtyForProduct(p) > 0 ? qtyStepperHTML(p, cartQtyForProduct(p)) : `<button class="add-btn" data-add="${p.id}">${p.addons && p.addons.length ? 'Customize' : '+ Add'}</button>`}
          </div>
        </div>
      </div>
    </article>`;
  }
  function qtyStepperHTML(p, qty){
    return `<div class="qty-stepper"><button data-dec="${p.id}" aria-label="Decrease quantity">−</button><span class="qty-val">${qty}</span><button data-inc="${p.id}" aria-label="Increase quantity">+</button></div>`;
  }
  function cartQtyForProduct(p){
    if(p.addons && p.addons.length) return 0;
    return KKStore.getCart().filter(l=>l.productId===p.id).reduce((s,l)=>s+l.qty,0);
  }

  function renderGrid(container, products){
    if(!container) return;
    if(!products.length){
      container.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🍽️</div><h3>We couldn't find that dish</h3><p>Try a different search term or explore our most popular items instead.</p><a href="#/menu" class="btn btn-primary">Explore Popular Items</a></div>`;
      return;
    }
    container.innerHTML = products.map(productCardHTML).join("");
    bindCardEvents(container);
    staggerIn(container.children);
  }

  function staggerIn(children){
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    Array.from(children).forEach((el,i)=>{
      el.classList.add("stagger-in");
      if(reduced){ el.classList.add("show"); return; }
      el.style.transitionDelay = Math.min(i*45, 360) + "ms";
      requestAnimationFrame(()=> requestAnimationFrame(()=> el.classList.add("show")));
    });
  }

  const delegatedContainers = new WeakSet();
  function bindCardEvents(scope){
    if(delegatedContainers.has(scope)) return;
    delegatedContainers.add(scope);
    scope.addEventListener("click", (e)=>{
      const addBtn = e.target.closest("[data-add]");
      if(addBtn){
        e.preventDefault();
        const p = KK.products.find(x=>x.id==addBtn.dataset.add);
        if(p.addons && p.addons.length){ navigate("#/product/"+p.slug); return; }
        animateAddToCart(addBtn);
        KKStore.addToCart(p, { qty:1 });
        kkToast(`${p.name} added to cart.`, "success");
        const cta = addBtn.closest("[data-cta]");
        if(cta) cta.innerHTML = qtyStepperHTML(p,1);
        return;
      }
      const incBtn = e.target.closest("[data-inc]");
      if(incBtn){
        const p = KK.products.find(x=>x.id==incBtn.dataset.inc);
        const line = KKStore.getCart().find(l=>l.productId===p.id);
        if(!line) return;
        KKStore.updateQty(line.key, line.qty+1);
        incBtn.previousElementSibling.textContent = line.qty+1;
        return;
      }
      const decBtn = e.target.closest("[data-dec]");
      if(decBtn){
        const p = KK.products.find(x=>x.id==decBtn.dataset.dec);
        const line = KKStore.getCart().find(l=>l.productId===p.id);
        if(!line) return;
        KKStore.updateQty(line.key, line.qty-1);
        const cta = decBtn.closest("[data-cta]");
        if(line.qty-1 <= 0){ cta.innerHTML = `<button class="add-btn" data-add="${p.id}">+ Add</button>`; }
        else{ decBtn.nextElementSibling.textContent = line.qty-1; }
        return;
      }
      const wishBtn = e.target.closest("[data-wish]");
      if(wishBtn){
        e.preventDefault();
        const slug = wishBtn.dataset.wish;
        if(!KKStore.isLoggedIn()){
          kkToast("Please login to save favourites.", "error");
          navigate("#/login?redirect=" + encodeURIComponent(location.hash.slice(2) || ""));
          return;
        }
        KKStore.toggleWishlist(slug).then(active=>{
          wishBtn.classList.toggle("active", active);
          wishBtn.classList.remove("pop"); void wishBtn.offsetWidth; wishBtn.classList.add("pop");
          kkToast(active ? "Added to favourites." : "Removed from favourites.");
        });
      }
    });
  }

  function animateAddToCart(fromEl){
    const cartIcon = document.querySelector(".icon-btn[href='#/cart']") || document.getElementById("floatingCart");
    if(!cartIcon) return;
    const start = fromEl.getBoundingClientRect();
    const end = cartIcon.getBoundingClientRect();
    const ball = document.createElement("div");
    ball.style.cssText = `position:fixed;z-index:1200;left:${start.left+start.width/2-8}px;top:${start.top}px;width:16px;height:16px;border-radius:50%;background:var(--marigold);pointer-events:none;transition:all .55s cubic-bezier(.22,.68,0,1);`;
    document.body.appendChild(ball);
    requestAnimationFrame(()=>{
      ball.style.left = (end.left+end.width/2-8)+"px";
      ball.style.top = (end.top+end.height/2-8)+"px";
      ball.style.opacity = "0.2";
      ball.style.transform = "scale(.4)";
    });
    setTimeout(()=>ball.remove(), 600);
    const badge = cartIcon.querySelector(".badge");
    if(badge){ badge.classList.remove("pulse"); void badge.offsetWidth; badge.classList.add("pulse"); }
  }

  function skeletonGrid(container, count=8){
    if(!container) return;
    container.innerHTML = Array.from({length:count}).map(()=>`<div class="skel skel-card"></div>`).join("");
  }

  /* ================================================================
     ROUTER
     ================================================================ */
  const root = () => document.getElementById("app-root");

  function parseHash(){
    let hash = location.hash.slice(1) || "/";
    let [path, qs] = hash.split("?");
    path = path.replace(/^\//,"");
    const segments = path.split("/").filter(Boolean);
    const route = segments[0] || "home";
    const seg = segments[1] || null;
    const params = new URLSearchParams(qs || "");
    return { route, seg, params };
  }

  function navigate(hash){ location.hash = hash; }
  window.kkNavigate = navigate;

  function setHashParam(routePrefix, key, val){
    const { params } = parseHash();
    params.set(key, val);
    history.replaceState(null, "", routePrefix + "?" + params.toString());
  }
  window.kkSetHashParam = setHashParam;

  const TITLES = {
    home: "Kaur's Kitchen (Rewari) — Ghar Ki Rasoi, Pyaar Ki Khushboo!",
    menu: "Explore Our Menu — Kaur's Kitchen",
    product: "Dish Details — Kaur's Kitchen",
    cart: "Your Cart — Kaur's Kitchen",
    checkout: "Checkout — Kaur's Kitchen",
    login: "Login — Kaur's Kitchen",
    signup: "Sign Up — Kaur's Kitchen",
    "forgot-password": "Forgot Password — Kaur's Kitchen",
    account: "My Account — Kaur's Kitchen",
    search: "Search — Kaur's Kitchen",
    offers: "Offers — Kaur's Kitchen",
    about: "About Us — Kaur's Kitchen",
    contact: "Contact Us — Kaur's Kitchen",
    faq: "FAQs — Kaur's Kitchen",
    terms: "Terms & Conditions — Kaur's Kitchen",
    privacy: "Privacy Policy — Kaur's Kitchen",
    refund: "Refund & Cancellation — Kaur's Kitchen",
    "404": "Page Not Found — Kaur's Kitchen"
  };

  function updateActiveNav(route){
    document.querySelectorAll("[data-route-link]").forEach(a=>{
      a.classList.toggle("active", a.dataset.routeLink === route);
    });
    document.querySelectorAll("[data-bottom-route]").forEach(a=>{
      a.classList.toggle("active", a.dataset.bottomRoute === route);
    });
    document.body.classList.toggle("hide-bottom-nav", NO_BOTTOM_NAV_ROUTES.has(route));
  }

  let currentCleanup = null;

  function render(){
    if(typeof currentCleanup === "function"){ try{ currentCleanup(); }catch(e){} currentCleanup = null; }
    const { route, seg, params } = parseHash();
    const tpl = TPL[route] || TPL["404"];
    root().innerHTML = tpl;
    document.title = TITLES[route] || TITLES["404"];
    updateActiveNav(route);
    window.scrollTo(0, 0);

    const initFn = ROUTES[route] || ROUTES["404"];
    try{ currentCleanup = initFn({ seg, params }) || null; }catch(err){ console.error("Route init error:", route, err); }

    initReveal();
  }

  function initRouter(){
    window.addEventListener("hashchange", render);
    window.addEventListener("load", render);
    if(document.readyState === "complete" || document.readyState === "interactive") render();

    /* Re-render on live catalog changes, but only for routes that are purely
       data-driven (no in-progress form input to lose). Debounced so a batch
       of admin edits doesn't cause a flurry of re-renders. */
    const catalogSafeRoutes = new Set(["home","menu","product","search","offers"]);
    let debounceT = null;
    KKSync.setOnChange(()=>{
      clearTimeout(debounceT);
      debounceT = setTimeout(()=>{
        if(catalogSafeRoutes.has(parseHash().route)) render();
      }, 300);
    });

    /* On login/logout, refresh header badges everywhere, and re-render
       account/checkout since their content depends directly on auth state. */
    document.addEventListener("kk:authchange", ()=>{
      refreshBadges();
      if(["account","checkout"].includes(parseHash().route)) render();
    });
  }

  return {
    bootShell, toast, initReveal, productCardHTML, renderGrid, bindCardEvents, skeletonGrid,
    animateAddToCart, initCounters, initHeroTilt, spicyFlames, ICON, navigate, initRouter,
    setHashParam, parseHash, rerender: render
  };
})();

</script>

<script>
/* ============================================================
   KAUR'S KITCHEN — ROUTE HANDLERS
   Each function receives { seg, params } from the router and
   wires up the just-injected template. Return a cleanup function
   if the route registers any document-level listeners.
   ============================================================ */

const ROUTES = {};

/* ---------------- HOME ---------------- */
ROUTES.home = function(){
  const heroImg = document.getElementById("heroImg");
  if(heroImg) heroImg.src = kkPlaceholder("🍛","#E2900C","#9A3324");

  const heroTitleEl = document.getElementById("heroBrandTitle");
  if(heroTitleEl){
    const parts = KK.config.brandName.trim().split(" ");
    const last = parts.pop();
    heroTitleEl.innerHTML = (parts.length ? parts.join(" ") + " " : "") + "<em>" + last + "</em>";
  }
  const heroTaglineEl = document.getElementById("heroTagline");
  if(heroTaglineEl) heroTaglineEl.textContent = '"' + KK.config.tagline + '"';

  document.getElementById("catRail").innerHTML = KK.categories.map(c=>`
    <a class="cat-card" href="#/menu?cat=${c.id}">
      <span class="cat-ring" style="background:linear-gradient(135deg, ${c.color[0]}22, ${c.color[1]}22)">${c.icon}</span>
      <span>${c.name}</span>
    </a>`).join("");

  KKApp.renderGrid(document.getElementById("popularGrid"), KK.getBestsellers().slice(0,8));

  (function renderReco(){
    const user = KKStore.getUser();
    const recentIds = KKStore.getRecent();
    let list;
    if(user || recentIds.length){
      document.getElementById("recoEyebrow").textContent = "Based on your taste";
      const recentCats = KK.products.filter(p=>recentIds.includes(p.id)).map(p=>p.category);
      list = KK.products.filter(p=>recentCats.includes(p.category) && !recentIds.includes(p.id));
      if(list.length < 6) list = list.concat(KK.getFeatured());
    } else {
      document.getElementById("recoEyebrow").textContent = "Popular picks";
      list = KK.getFeatured();
    }
    const seen = new Set();
    list = list.filter(p=> !seen.has(p.id) && seen.add(p.id)).slice(0,10);
    KKApp.renderGrid(document.getElementById("recoRail"), list);
  })();

  document.getElementById("offerGrid").innerHTML = KK.offers.map(o=>`
    <div class="offer-card ${o.theme}">
      <span class="badge">${o.badge}</span>
      <h4>${o.title}</h4><p>${o.desc}</p>
    </div>`).join("");

  document.getElementById("reviewRail").innerHTML = KK.reviews.map(r=>`
    <div class="review-card">
      <div class="review-top"><span class="avatar">${r.name[0]}</span><div><b>${r.name}</b></div></div>
      <div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
      <p>"${r.text}"</p>
      <span class="rdate">${r.date}</span>
    </div>`).join("");
